# =============================================================================
# NOC Signage - reverse proxy, HTTPS only, /health, kiosk wrapper + admin guard
# =============================================================================

# --- Redirect all plain HTTP to HTTPS ----------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Health endpoint is allowed over HTTP for local Docker/monitoring probes.
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Main HTTPS site ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/signage.crt;
    ssl_certificate_key /etc/nginx/certs/signage.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # --- Health endpoint (used by Docker healthcheck + external monitoring) --
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
        access_log off;
    }

    # --- Kiosk rotation wrapper: the URL the TV / MeetingBoard opens ----------
    #     https://<host>/signage/  -> rotates Operations/Network/Security/Exec
    # Ohne Schraegstrich am Ende landet die Anfrage sonst bei Dashy und der
    # zeigt seine eigene 404-Seite - man sucht dann den Fehler an der falschen
    # Stelle. Darum jede Wandseite auch ohne Schraegstrich erreichbar machen.
    location = /signage    { return 301 /signage/; }
    location = /lage       { return 301 /lage/; }
    location = /stoerungen { return 301 /stoerungen/; }
    location = /wall       { return 301 /wall/; }
    location = /site       { return 301 /site/; }

    location /signage/ {
        alias /usr/share/nginx/html/assets/;
        index signage.html;
        try_files $uri $uri/ /signage/signage.html;
    }

    # Serve custom static tiles (css/html) referenced by widgets.
    # NOTE: must NOT be /assets/ — Dashy serves its own JS bundles from
    # /assets/, so a custom /assets/ location here shadows the app and breaks it.
    location /tiles/ {
        alias /usr/share/nginx/html/assets/;
    }

    # --- Admin surface: protected by basic auth at the proxy ------------------
    #     Dashy's in-app config editor is disabled globally; this location adds
    #     a second gate for any privileged/editable variant you expose here.
    location /admin {
        auth_basic           "NOC Signage Admin";
        auth_basic_user_file /etc/nginx/certs/.htpasswd;
        proxy_pass         http://dashy:8080/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Screenshots of non-embeddable sites (from the shotter service) -------
    location /shots/ {
        alias /usr/share/nginx/html/shots/;
        add_header Cache-Control "no-store";
    }


    # --- Betriebslage: die Hauptwand -----------------------------------------
    #     Zeigt gemessene Zustaende der eigenen Systeme (services/probe) statt
    #     Nachrichten. Das ist die Seite, die beim Vorbeilaufen zaehlt.
    location /lage/ {
        alias /usr/share/nginx/html/assets/;
        index lage.html;
        try_files $uri $uri/ /lage/lage.html;
    }

    # --- Messdaten der Sonde --------------------------------------------------
    #     ./state wird von services/probe beschrieben und hier nur gelesen.
    #     Nur .json ausliefern: im selben Verzeichnis liegt auch der
    #     CVE-Zustand (seen.json), der niemanden etwas angeht.
    location = /data/probe.json {
        alias /usr/share/nginx/html/data/probe.json;
        add_header Cache-Control "no-store" always;
        default_type application/json;
    }
    # Alles andere unter /data/ bleibt zu: im selben Verzeichnis liegt der
    # Zustand des CVE-Watchers, der nicht ins Netz gehoert.
    location /data/ { deny all; }

    # --- Seitenliste der Wand -------------------------------------------------
    #     Bewusst NUR diese eine Datei aus config/: dort liegen auch die
    #     Zugangsdaten (secrets.env), die nichts im Netz zu suchen haben.
    location = /config/pages.txt {
        alias /usr/share/nginx/html/wandconfig/pages.txt;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location = /config/sources.txt {
        alias /usr/share/nginx/html/wandconfig/sources.txt;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location /config/ { deny all; }

    # --- Website-Ansicht: echte Seite gezoomt auf die Wand --------------------
    location /site/ {
        alias /usr/share/nginx/html/assets/;
        index site.html;
        try_files $uri $uri/ /site/site.html;
    }

    # --- Anbieterstoerungen, eigengestaltet ----------------------------------
    #     Ersetzt die Dashy-RSS-Seite: eine Karte je Anbieter statt einer
    #     Textwueste aus allen Feeds hintereinander.
    location /stoerungen/ {
        alias /usr/share/nginx/html/assets/;
        index stoerungen.html;
        try_files $uri $uri/ /stoerungen/stoerungen.html;
    }

    # --- Eigengestaltete Alert-Wand (nutzt den /feeds/-Proxy) ----------------
    location /wall/ {
        alias /usr/share/nginx/html/assets/;
        index wall.html;
        try_files $uri $uri/ /wall/wall.html;
    }

    # --- RSS-Proxy: externe Feeds same-origin ausliefern -----------------------
    #     Der Browser darf fremde Feeds nicht selbst laden (CORS). Nginx holt sie
    #     serverseitig und liefert sie unter /feeds/<name> aus - erst dadurch kann
    #     die eigengestaltete Wall-Seite (/wall/) sie rendern.
    #     127.0.0.11 = Dockers interner DNS; Auflösung zur Laufzeit, damit Nginx
    #     auch startet, wenn eine Quelle gerade nicht auflösbar ist.
    resolver 127.0.0.11 valid=30s ipv6=off;
    #
    # HINWEIS: Anbieter-Statusfeeds stehen bewusst NICHT mehr hier fest im
    # Code. Sie wechseln regelmaessig die Adresse (Microsoft hat
    # status.office365.com/api/feed/rss zurueckgezogen, azureedge.net wurde
    # abgeschaltet) - und eine tote Adresse waere hier nur mit einem Update
    # zu beheben. Sie kommen aus config/endpoints.env ueber FEED1..6_URL und
    # werden von extra/feed*.conf eingebunden (siehe include weiter unten).
    #
    location = /feeds/heise-alerts {
        set $up_heise_alerts "https://www.heise.de/security/rss/alert-news-atom.xml";
        proxy_pass $up_heise_alerts;
        proxy_set_header Host www.heise.de;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; NOCSignage/1.0)";
        proxy_set_header Accept "application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.8";
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
        default_type application/xml;
        add_header Cache-Control "no-store" always;
    }
    location = /feeds/heise-security {
        set $up_heise_security "https://www.heise.de/security/rss/news-atom.xml";
        proxy_pass $up_heise_security;
        proxy_set_header Host www.heise.de;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; NOCSignage/1.0)";
        proxy_set_header Accept "application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.8";
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
        default_type application/xml;
        add_header Cache-Control "no-store" always;
    }
    location = /feeds/bsi {
        set $up_bsi "https://wid.cert-bund.de/content/public/securityAdvisory/rss";
        proxy_pass $up_bsi;
        proxy_set_header Host wid.cert-bund.de;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; NOCSignage/1.0)";
        proxy_set_header Accept "application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.8";
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
        default_type application/xml;
        add_header Cache-Control "no-store" always;
    }
    location = /feeds/cisa {
        set $up_cisa "https://www.cisa.gov/cybersecurity-advisories/all.xml";
        proxy_pass $up_cisa;
        proxy_set_header Host www.cisa.gov;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; NOCSignage/1.0)";
        proxy_set_header Accept "application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.8";
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
        default_type application/xml;
        add_header Cache-Control "no-store" always;
    }
    location = /feeds/cisco {
        set $up_cisco "https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml";
        proxy_pass $up_cisco;
        proxy_set_header Host sec.cloudapps.cisco.com;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; NOCSignage/1.0)";
        proxy_set_header Accept "application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.8";
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
        default_type application/xml;
        add_header Cache-Control "no-store" always;
    }

    # --- CISA KEV: autoritative Liste aktiv ausgenutzter Schwachstellen -------
    #     Ersetzt für erkannte CVEs das Raten durch eine belastbare Quelle.
    location = /feeds/kev {
        set $up_kev "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json";
        proxy_pass $up_kev;
        proxy_set_header Host www.cisa.gov;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; NOCSignage/1.0)";
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # --- Standort für lokale, nicht eingecheckte Zusatz-Locations -------------
    #     z. B. Zabbix und weitere Backends (siehe extra/*.conf.tmpl).
    #     Dateien hier sind per .gitignore ausgenommen - Tokens bleiben lokal.
    include /etc/nginx/conf.d/extra/*.conf;

    # --- Multi-page sub-config files ------------------------------------------
    #     THIS BLOCK IS LOAD-BEARING, not just an optimization: Dashy's own
    #     config-loader (services/endpoints/api/config-files.js) always
    #     path.basename()'s a page's "path:" and reads the result flat from
    #     its user-data root ("/app/user-data/<name>.yml") -- it never looks
    #     inside a "pages/" subfolder, no matter what conf.yml says. Serving
    #     "/pages/*.yml" here, directly from disk, is what makes the
    #     "pages/<file>.yml" convention used by every profile actually work;
    #     if this location (or Nginx entirely) is ever removed, every page
    #     switch breaks with "Unable to load config from '/pages/x.yml'".
    location /pages/ {
        alias /usr/share/nginx/html/pages/;
        default_type application/x-yaml;
    }

    # --- Dashy application (unauthenticated, read-only display) ---------------
    location / {
        proxy_pass          http://dashy:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  90s;
    }
}
