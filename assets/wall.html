<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Alert Wall</title>
<style>
  /* Dark-only NOC-Wand. Farben: validierte Status-Palette (good/warning/
     serious/critical) auf der dokumentierten dunklen Fläche. Statusfarbe trägt
     nie allein Bedeutung - jede Meldung führt zusätzlich ein Label. */
  :root{
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8a8a80;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --rule:#2e2e2c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--plane); color:var(--ink); overflow:hidden; cursor:none;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    font-variant-numeric:tabular-nums;
    display:flex; flex-direction:column;
  }

  /* ---------- Kopfzeile ---------- */
  header{
    display:flex; align-items:baseline; gap:24px;
    padding:18px 32px 14px; border-bottom:1px solid var(--rule);
  }
  h1{font-size:26px; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
  #sub{color:var(--ink-3); font-size:14px; letter-spacing:.06em}
  #clock{margin-left:auto; font-size:38px; font-weight:600; line-height:1}
  #date{color:var(--ink-2); font-size:14px}

  /* ---------- KPI-Zeile (Hero-Zahlen, kein Diagramm) ---------- */
  #kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:16px 32px}
  .kpi{
    background:var(--surface); border:1px solid var(--rule); border-radius:10px;
    padding:14px 18px; display:flex; flex-direction:column; gap:2px;
  }
  .kpi .n{font-size:46px; font-weight:700; line-height:1.05}
  .kpi .l{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
  .kpi.crit .n{color:var(--critical)} .kpi.warn .n{color:var(--warning)}
  .kpi.ok .n{color:var(--good)}

  /* ---------- Meldungsstrom ---------- */
  #stream{
    flex:1; min-height:0; overflow:hidden;
    display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:4px 32px 24px;
    align-content:start;
  }
  .row{
    background:var(--surface); border:1px solid var(--rule); border-radius:10px;
    border-left-width:5px; padding:12px 16px; display:flex; flex-direction:column; gap:6px;
    animation:in .35s ease both;
  }
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row.critical{border-left-color:var(--critical)}
  .row.serious {border-left-color:var(--serious)}
  .row.warning {border-left-color:var(--warning)}
  .row.info    {border-left-color:var(--ink-3)}
  .meta{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-3)}
  /* Status = Symbol + Text + Farbe, nie Farbe allein */
  .sev{font-weight:700; letter-spacing:.1em; text-transform:uppercase; display:flex; align-items:center; gap:5px}
  .row.critical .sev{color:var(--critical)}
  .row.serious  .sev{color:var(--serious)}
  .row.warning  .sev{color:var(--warning)}
  .row.info     .sev{color:var(--ink-2)}
  .badge{background:var(--critical); color:#fff; padding:2px 8px; border-radius:999px;
         font-weight:700; letter-spacing:.04em}
  .cve{background:var(--surface-2); color:var(--ink-2); padding:2px 8px; border-radius:999px}
  .src{background:var(--surface-2); color:var(--ink-2); padding:2px 8px; border-radius:999px; letter-spacing:.04em}
  .when{margin-left:auto}
  .title{font-size:17px; line-height:1.3; color:var(--ink);
         display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

  footer{padding:8px 32px 14px; color:var(--ink-3); font-size:12px;
         border-top:1px solid var(--rule); display:flex; gap:18px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .dot.up{background:var(--good)} .dot.down{background:var(--critical)}
</style>
</head>
<body>
  <header>
    <h1>Security Alerts</h1>
    <div id="sub">NOC · Live-Feed</div>
    <div style="margin-left:auto;text-align:right">
      <div id="clock">--:--:--</div>
      <div id="date">–</div>
    </div>
  </header>

  <section id="kpis">
    <div class="kpi crit"><div class="n" id="k-crit">–</div><div class="l">Kritisch (24 h)</div></div>
    <div class="kpi warn"><div class="n" id="k-warn">–</div><div class="l">Hoch / Warnung (24 h)</div></div>
    <div class="kpi"><div class="n" id="k-total">–</div><div class="l">Meldungen (24 h)</div></div>
    <div class="kpi ok"><div class="n" id="k-src">–</div><div class="l">Quellen online</div></div>
  </section>

  <section id="stream"></section>

  <footer><span id="sources"></span><span id="updated"></span></footer>

<script>
// ---------------------------------------------------------------------------
// Datenquellen werden von Nginx same-origin ausgeliefert (nginx/conf.d/dashy.conf):
//   /feeds/<id>   RSS/Atom der News- und Advisory-Quellen
//   /feeds/kev    CISA "Known Exploited Vulnerabilities" (autoritativ, JSON)
//   /api/zabbix   Zabbix JSON-RPC; Token hängt Nginx serverseitig an
//                 (nginx/conf.d/extra/zabbix.conf – nicht im Git)
// ---------------------------------------------------------------------------
const MAX_ROWS       = 8;
const REFRESH_MS     = 5 * 60 * 1000;
const KEV_REFRESH_MS = 6 * 60 * 60 * 1000;   // KEV ändert sich selten
const ZABBIX_ENABLED = false;                // true, sobald extra/zabbix.conf steht

// Fallback, falls assets/feeds.json fehlt oder unlesbar ist.
let FEEDS = [
  { id:'heise-alerts',   label:'heise Alerts' },
  { id:'bsi',            label:'BSI CERT-Bund' },
  { id:'cisa',           label:'CISA' },
  { id:'cisco',          label:'Cisco PSIRT' },
  { id:'heise-security', label:'heise Security' },
];

const SEV_LABEL = { critical:'Kritisch', serious:'Hoch', warning:'Warnung', info:'Info' };
const SEV_ICON  = { critical:'⛔', serious:'▲', warning:'!', info:'•' };
const SEV_ORDER = { critical:0, serious:1, warning:2, info:3 };

let kevSet = new Set();   // CVE-IDs, die laut CISA aktiv ausgenutzt werden

const esc = t => String(t).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

// Heuristik über den Text – greift nur, wenn keine belastbare Quelle passt.
function severityFromText(text){
  const t = (text || '').toLowerCase();
  if (/\b(kritisch|critical|zero[- ]day|aktiv ausgenutzt|actively exploited|notfall|emergency)\b/.test(t)) return 'critical';
  if (/\b(hoch|high|schwerwiegend|severe|remote code execution|rce)\b/.test(t))                            return 'serious';
  if (/\b(mittel|medium|warnung|warning|sicherheitslücke|sicherheitsluecke|vulnerability|advisory|patch)\b/.test(t)) return 'warning';
  return 'info';
}

// Belastbar vor Heuristik: steht ein genannter CVE in der KEV-Liste, ist die
// Lücke nachweislich in Ausnutzung – das schlägt jede Textanalyse.
function classify(title, desc){
  const text = title + ' ' + desc;
  const cves = text.toUpperCase().match(/CVE-\d{4}-\d{4,7}/g) || [];
  const hit  = cves.find(c => kevSet.has(c));
  if (hit) return { sev:'critical', badge:'Aktiv ausgenutzt', cve:hit, authoritative:true };
  return { sev:severityFromText(text), badge:null, cve:cves[0] || null, authoritative:false };
}

function relTime(d){
  if (!d) return '';
  const m = Math.round((Date.now() - d.getTime()) / 60000);
  if (m < 1)  return 'gerade eben';
  if (m < 60) return 'vor ' + m + ' min';
  const h = Math.round(m / 60);
  if (h < 24) return 'vor ' + h + ' h';
  return 'vor ' + Math.round(h / 24) + ' d';
}

async function loadKev(){
  try {
    const r = await fetch('/feeds/kev', { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    kevSet = new Set((j.vulnerabilities || []).map(v => String(v.cveID || '').toUpperCase()));
  } catch (e) { /* KEV optional: ohne sie greift die Heuristik */ }
}

async function loadFeed(f){
  const res = await fetch('/feeds/' + f.id, { cache:'no-store' });
  if (!res.ok) throw new Error(res.status);
  const xml = new DOMParser().parseFromString(await res.text(), 'application/xml');
  if (xml.querySelector('parsererror')) throw new Error('parse');
  return [...xml.querySelectorAll('item, entry')].map(n => {
    const title = (n.querySelector('title')?.textContent || '').trim();
    const desc  = (n.querySelector('description, summary')?.textContent || '').trim();
    const raw   = n.querySelector('pubDate, published, updated')?.textContent;
    const date  = raw ? new Date(raw) : null;
    const c     = classify(title, desc);
    return Object.assign({ title, source:f.label,
                           date:(date && !isNaN(date)) ? date : null }, c);
  }).filter(i => i.title);
}

// Zabbix: Schweregrade 0-5 -> unsere vier Stufen. Das sind echte Alarme aus dem
// Monitoring, keine News – sie stehen deshalb immer ganz oben.
const ZBX_SEV = { 5:'critical', 4:'critical', 3:'serious', 2:'warning', 1:'info', 0:'info' };
async function loadZabbix(){
  const res = await fetch('/api/zabbix', {
    method:'POST', cache:'no-store',
    headers:{ 'Content-Type':'application/json-rpc' },
    body: JSON.stringify({ jsonrpc:'2.0', method:'problem.get',
      params:{ output:['name','severity','clock'], sortfield:['eventid'],
               sortorder:'DESC', limit:20 }, id:1 }),
  });
  if (!res.ok) throw new Error(res.status);
  const j = await res.json();
  if (j.error) throw new Error(j.error.message || 'zabbix');
  return (j.result || []).map(p => ({
    title: p.name,
    source: 'Zabbix',
    date: p.clock ? new Date(Number(p.clock) * 1000) : null,
    sev: ZBX_SEV[Number(p.severity)] || 'info',
    badge: 'Alarm', cve: null, authoritative: true, isAlarm: true,
  }));
}

function render(items, online, total, failed){
  const dayAgo = Date.now() - 864e5;
  const recent = items.filter(i => i.date && i.date.getTime() > dayAgo);
  const n = s => recent.filter(i => i.sev === s).length;

  document.getElementById('k-crit').textContent  = n('critical');
  document.getElementById('k-warn').textContent  = n('serious') + n('warning');
  document.getElementById('k-total').textContent = recent.length;
  document.getElementById('k-src').textContent   = online + '/' + total;

  // Echte Alarme vor News, dann Schweregrad, dann Aktualität.
  const top = items.slice().sort((a,b) =>
      (Number(!!b.isAlarm) - Number(!!a.isAlarm)) ||
      (SEV_ORDER[a.sev] - SEV_ORDER[b.sev]) ||
      ((b.date ? b.date.getTime() : 0) - (a.date ? a.date.getTime() : 0))
    ).slice(0, MAX_ROWS);

  document.getElementById('stream').innerHTML = top.map(i =>
    '<article class="row ' + i.sev + '">' +
      '<div class="meta">' +
        '<span class="sev">' + SEV_ICON[i.sev] + ' ' + SEV_LABEL[i.sev] + '</span>' +
        (i.badge ? '<span class="badge">' + esc(i.badge) + '</span>' : '') +
        (i.cve   ? '<span class="cve">'   + esc(i.cve)   + '</span>' : '') +
        '<span class="src">' + esc(i.source) + '</span>' +
        '<span class="when">' + relTime(i.date) + '</span>' +
      '</div>' +
      '<div class="title">' + esc(i.title) + '</div>' +
    '</article>').join('');

  document.getElementById('sources').innerHTML =
    '<span class="dot ' + (failed.length ? 'down' : 'up') + '"></span>' +
    (failed.length ? 'Quelle nicht erreichbar: ' + failed.join(', ')
                   : 'Alle Quellen erreichbar');
  document.getElementById('updated').textContent =
    'Aktualisiert ' + new Date().toLocaleTimeString('de-DE') +
    (kevSet.size ? ' · KEV ' + kevSet.size + ' CVEs' : ' · KEV nicht geladen');
}

async function refresh(){
  const jobs   = FEEDS.map(loadFeed);
  const labels = FEEDS.map(f => f.label);
  if (ZABBIX_ENABLED) { jobs.push(loadZabbix()); labels.push('Zabbix'); }

  const results = await Promise.allSettled(jobs);
  const items = [], failed = [];
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') items.push(...r.value); else failed.push(labels[i]);
  });
  render(items, labels.length - failed.length, labels.length, failed);
}

async function boot(){
  try {
    const r = await fetch('/tiles/feeds.json', { cache:'no-store' });
    if (r.ok) {
      const cfg = await r.json();
      const list = (cfg.feeds || []).filter(f => f.enabled !== false);
      if (list.length) FEEDS = list;
    }
  } catch (e) { /* Fallback-Liste oben bleibt aktiv */ }
  await loadKev();
  await refresh();
  setInterval(refresh, REFRESH_MS);
  setInterval(loadKev, KEV_REFRESH_MS);
}

setInterval(() => {
  const n = new Date();
  document.getElementById('clock').textContent = n.toLocaleTimeString('de-DE');
  document.getElementById('date').textContent  =
    n.toLocaleDateString('de-DE', { weekday:'long', day:'2-digit', month:'long' });
}, 1000);

boot();
</script>
</body>
</html>
