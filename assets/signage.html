<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>NOC Signage Wall</title>
  <style>
    :root { --bg:#0b0f14; --fg:#e6edf3; --accent:#00e676; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; background:var(--bg); color:var(--fg);
      font-family:"Segoe UI", system-ui, sans-serif; overflow:hidden;
      cursor:none; }                       /* hide mouse cursor */
    #stage { position:absolute; inset:0; transition:transform .5s ease; }
    iframe { width:100%; height:100%; border:0; display:block; background:var(--bg); }
    /* Top status bar with page name + clock */
    #bar { position:fixed; top:0; left:0; right:0; height:34px; z-index:10;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 18px; background:rgba(0,0,0,.55); backdrop-filter:blur(6px);
      font-size:14px; letter-spacing:.5px; }
    #page { color:var(--accent); font-weight:600; text-transform:uppercase; }
    #dots span { display:inline-block; width:8px; height:8px; margin:0 3px;
      border-radius:50%; background:#33414f; }
    #dots span.on { background:var(--accent); }
    #clock { font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <div id="bar">
    <div id="page">Operations</div>
    <div id="dots"></div>
    <div id="clock">--:--:--</div>
  </div>
  <div id="stage"><iframe id="frame" src="/" title="dashboard"></iframe></div>

  <script>
    // -----------------------------------------------------------------------
    // NOC signage kiosk controller
    //   * rotates the 4 Dashy pages every ROTATE_MS
    //   * full page reload every RELOAD_MS (idle recovery / fresh data)
    //   * burn-in prevention via periodic 1px stage shift
    //   * watchdog reload if a frame fails to load
    // Config is overridable via query string: ?rotate=30&reload=300
    // -----------------------------------------------------------------------
    const qs = new URLSearchParams(location.search);
    const ROTATE_MS = (parseInt(qs.get('rotate'), 10) || 30) * 1000;   // 30s
    const RELOAD_MS = (parseInt(qs.get('reload'), 10) || 300) * 1000;  // 5min
    const SHIFT_MS  = 90 * 1000;                                       // burn-in

    // Seitenliste. Sie steht NICHT hier, sondern in config/pages.txt - diese
    // Datei ist versioniert, eine Aenderung darin waere beim naechsten
    // "git reset --hard" weg. Nginx liefert die Liste unter /config/pages.txt
    // aus; nach dem Bearbeiten genuegt "docker compose restart nginx".
    //
    // Format je Zeile:   Name | Adresse | Sekunden
    //
    // Diese Liste hier ist nur die Rueckfallebene, falls die Datei fehlt oder
    // unlesbar ist - die Wand soll auch dann etwas zeigen.
    let PAGES = [
      { name: 'Betriebslage', url: '/lage/',       secs: 60 },
      { name: 'Störungen',    url: '/stoerungen/', secs: 30 },
      { name: 'Sicherheit',   url: '/wall/',       secs: 30 },
    ];

    const frame = document.getElementById('frame');
    const stage = document.getElementById('stage');
    const pageEl = document.getElementById('page');
    const dotsEl = document.getElementById('dots');

    let dots = [];
    let rotTimer = null;   // vor show(0) deklariert: scheduleNext greift darauf zu

    function buildDots() {
      dotsEl.innerHTML = '';
      PAGES.forEach(() => dotsEl.insertAdjacentHTML('beforeend', '<span></span>'));
      dots = [...dotsEl.children];
    }

    // "Name | Adresse | Sekunden", # ist Kommentar. Bewusst simpel gehalten:
    // die Datei bearbeitet jemand im Flur per SSH, nicht in einer IDE.
    function parsePages(text) {
      const out = [];
      for (const line of text.split('\n')) {
        const l = line.trim();
        if (!l || l.startsWith('#')) continue;
        const parts = l.split('|').map(x => x.trim());
        if (parts.length < 2 || !parts[1]) continue;
        const secs = parseInt(parts[2], 10);
        out.push({ name: parts[0] || parts[1],
                   url: parts[1],
                   secs: Number.isFinite(secs) && secs > 0 ? secs : undefined });
      }
      return out;
    }

    let pagesSource = null;
    async function loadPages() {
      try {
        const r = await fetch('/config/pages.txt?t=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const list = parsePages(await r.text());
        // Eine leere oder komplett auskommentierte Datei darf die Wand nicht
        // schwarz schalten - dann bleibt die Rueckfallebene stehen.
        if (list.length) PAGES = list;
        pagesSource = 'config/pages.txt';
      } catch (e) {
        // Nicht stumm bleiben: "die Wand zeigt nicht, was ich eingetragen habe"
        // ist sonst kaum aufzuklaeren - man sieht der Rotation nicht an, aus
        // welcher Quelle sie kommt.
        console.warn('config/pages.txt nicht lesbar, nutze Vorgabeliste:', e);
        pagesSource = null;
      }
    }

    let idx = 0;
    function show(i) {
      idx = (i + PAGES.length) % PAGES.length;
      frame.src = PAGES[idx].url;
      pageEl.textContent = PAGES[idx].name
        + (pagesSource ? '' : '   ⚠ config/pages.txt fehlt – Vorgabeliste');
      dots.forEach((d, n) => d.classList.toggle('on', n === idx));
      scheduleNext();
    }
    // Erst Liste holen, dann anzeigen. Ohne await stuenden Punkte und erste
    // Seite noch fuer die Vorgabeliste.
    loadPages().then(() => { buildDots(); show(0); });

    // Weiterschalten. Kein fester Takt mehr, sondern eine Kette von Timern -
    // nur so kann jede Seite ihre eigene Standzeit haben.
    function scheduleNext() {
      clearTimeout(rotTimer);
      const secs = PAGES[idx].secs;
      rotTimer = setTimeout(() => show(idx + 1),
                            secs ? secs * 1000 : ROTATE_MS);
    }
    scheduleNext();

    // Full reload keeps memory clean and recovers from any stalled state.
    setTimeout(() => location.reload(), RELOAD_MS);

    // Burn-in prevention: nudge the whole stage by up to a couple of pixels.
    let s = 0;
    setInterval(() => {
      s = (s + 1) % 4;
      const dx = [0, 1, 0, -1][s], dy = [0, 1, 0, -1][s];
      stage.style.transform = `translate(${dx}px, ${dy}px)`;
    }, SHIFT_MS);

    // Clock.
    setInterval(() => {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('en-GB');
    }, 1000);

    // Watchdog: if a frame does not signal load within 20s, reload it.
    let wd;
    function armWatchdog() {
      clearTimeout(wd);
      wd = setTimeout(() => frame.src = PAGES[idx].url, 20000);
    }
    frame.addEventListener('load', () => clearTimeout(wd));
    setInterval(armWatchdog, ROTATE_MS);
  </script>
</body>
</html>
