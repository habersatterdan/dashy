<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>NOC Signage Wall</title>
  <style>
    :root { --bg:#0b0f14; --fg:#e6edf3; --accent:#00e676; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; background:var(--bg); color:var(--fg);
      font-family:"Segoe UI", system-ui, sans-serif; overflow:hidden;
      cursor:none; }                       /* hide mouse cursor */
    #stage { position:absolute; inset:0; transition:transform .5s ease; }
    iframe { width:100%; height:100%; border:0; display:block; background:var(--bg); }
    /* Top status bar with page name + clock */
    #bar { position:fixed; top:0; left:0; right:0; height:34px; z-index:10;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 18px; background:rgba(0,0,0,.55); backdrop-filter:blur(6px);
      font-size:14px; letter-spacing:.5px; }
    #page { color:var(--accent); font-weight:600; text-transform:uppercase; }
    #dots span { display:inline-block; width:8px; height:8px; margin:0 3px;
      border-radius:50%; background:#33414f; }
    #dots span.on { background:var(--accent); }
    #clock { font-variant-numeric:tabular-nums; }

    /* --- Alarmzustand ---------------------------------------------------
       Wenn etwas Kritisches laeuft, bricht die Wand die Rotation ab und
       bleibt auf der Lageseite. Damit das auch aus dem Augenwinkel auffaellt:
       ein pulsierender Rahmen. Bewusst langsam (2,4 s) - schnelles Blinken
       nervt nach zehn Minuten und wird dann ignoriert oder abgeschaltet. */
    #alarm { position:fixed; inset:0; z-index:9; pointer-events:none;
      border:0 solid #d03b3b; transition:border-width .3s ease; }
    body.alarm #alarm { border-width:10px; animation:puls 2.4s ease-in-out infinite; }
    @keyframes puls { 0%,100% { border-color:#d03b3b; }
                      50%     { border-color:#6b1f1f; } }
    #alarmtext { position:fixed; top:34px; left:0; right:0; z-index:11;
      background:#d03b3b; color:#fff; font-weight:700; letter-spacing:.06em;
      padding:6px 18px; font-size:15px; display:none; }
    body.alarm #alarmtext { display:block; }
  </style>
</head>
<body>
  <div id="bar">
    <div id="page">Operations</div>
    <div id="dots"></div>
    <div id="clock">--:--:--</div>
  </div>
  <div id="alarmtext"></div>
  <div id="alarm"></div>
  <div id="stage"><iframe id="frame" src="/" title="dashboard"></iframe></div>

  <script>
    // -----------------------------------------------------------------------
    // NOC signage kiosk controller
    //   * rotates the 4 Dashy pages every ROTATE_MS
    //   * full page reload every RELOAD_MS (idle recovery / fresh data)
    //   * burn-in prevention via periodic 1px stage shift
    //   * watchdog reload if a frame fails to load
    // Config is overridable via query string: ?rotate=30&reload=300
    // -----------------------------------------------------------------------
    const qs = new URLSearchParams(location.search);
    const ROTATE_MS = (parseInt(qs.get('rotate'), 10) || 30) * 1000;   // 30s
    const RELOAD_MS = (parseInt(qs.get('reload'), 10) || 300) * 1000;  // 5min
    const SHIFT_MS  = 90 * 1000;                                       // burn-in

    // Seitenliste. Sie steht NICHT hier, sondern in config/pages.txt - diese
    // Datei ist versioniert, eine Aenderung darin waere beim naechsten
    // "git reset --hard" weg. Nginx liefert die Liste unter /config/pages.txt
    // aus; nach dem Bearbeiten genuegt "docker compose restart nginx".
    //
    // Format je Zeile:   Name | Adresse | Sekunden
    //
    // Diese Liste hier ist nur die Rueckfallebene, falls die Datei fehlt oder
    // unlesbar ist - die Wand soll auch dann etwas zeigen.
    let PAGES = [
      { name: 'Betriebslage', url: '/lage/',       secs: 60 },
      { name: 'Störungen',    url: '/stoerungen/', secs: 30 },
      { name: 'Sicherheit',   url: '/wall/',       secs: 30 },
    ];

    const frame = document.getElementById('frame');
    const stage = document.getElementById('stage');
    const pageEl = document.getElementById('page');
    const dotsEl = document.getElementById('dots');

    let dots = [];
    let rotTimer = null;   // vor show(0) deklariert: scheduleNext greift darauf zu

    function buildDots() {
      dotsEl.innerHTML = '';
      PAGES.forEach(() => dotsEl.insertAdjacentHTML('beforeend', '<span></span>'));
      dots = [...dotsEl.children];
    }

    // "Name | Adresse | Sekunden", # ist Kommentar. Bewusst simpel gehalten:
    // die Datei bearbeitet jemand im Flur per SSH, nicht in einer IDE.
    function parsePages(text) {
      const out = [];
      for (const line of text.split('\n')) {
        const l = line.trim();
        if (!l || l.startsWith('#')) continue;
        const parts = l.split('|').map(x => x.trim());
        if (parts.length < 2 || !parts[1]) continue;
        // "@login | <url>" ist keine Wandseite, sondern eine Adresse, die
        // einmal vor der Rotation aufgerufen wird, um eine Sitzung zu oeffnen
        // (z. B. Zabbix' Gast-Anmeldung). Siehe warmup().
        if (parts[0].toLowerCase() === '@login') { LOGINS.push(parts[1]); continue; }
        // "@alarm | <url>" ist die Seite, auf die bei einer kritischen Lage
        // umgeschaltet wird. Ohne die Zeile bleibt es bei /lage/.
        if (parts[0].toLowerCase() === '@alarm') { ALARM_PAGE = parts[1]; continue; }
        const secs = parseInt(parts[2], 10);
        out.push({ name: parts[0] || parts[1],
                   url: parts[1],
                   secs: Number.isFinite(secs) && secs > 0 ? secs : undefined });
      }
      return out;
    }

    let pagesSource = null;
    const LOGINS = [];
    let ALARM_PAGE = '/lage/';

    /* Anmeldung "simulieren": Zabbix zeigt seine Dashboards erst nach einem
       Klick auf "Als Gast anmelden" - dabei setzt es ein Sitzungs-Cookie.
       Genau diesen einen Aufruf machen wir hier automatisch, einmal beim
       Start der Wand. Weil alles ueber unseren Proxy same-origin laeuft, gilt
       das Cookie anschliessend fuer alle Dashboard-Seiten.

       Bewusst in einem unsichtbaren iframe statt per fetch(): der Aufruf soll
       sich genau wie ein Seitenaufruf im Browser verhalten, samt Cookie-
       Uebernahme und Weiterleitungen. */
    function warmup() {
      if (!LOGINS.length) return Promise.resolve();
      return new Promise(resolve => {
        let offen = LOGINS.length;
        const fertig = () => { if (--offen <= 0) resolve(); };
        for (const url of LOGINS) {
          const f = document.createElement('iframe');
          f.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;border:0';
          f.addEventListener('load', fertig);
          // Auch wenn das Ziel nie "load" meldet, darf die Wand nicht haengen.
          setTimeout(fertig, 8000);
          f.src = url;
          document.body.appendChild(f);
          // Nach 15 s wieder abraeumen - das Cookie bleibt im Browser.
          setTimeout(() => f.remove(), 15000);
        }
      });
    }

    async function loadPages() {
      try {
        const r = await fetch('/config/pages.txt?t=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const list = parsePages(await r.text());
        // Eine leere oder komplett auskommentierte Datei darf die Wand nicht
        // schwarz schalten - dann bleibt die Rueckfallebene stehen.
        if (list.length) PAGES = list;
        pagesSource = 'config/pages.txt';
      } catch (e) {
        // Nicht stumm bleiben: "die Wand zeigt nicht, was ich eingetragen habe"
        // ist sonst kaum aufzuklaeren - man sieht der Rotation nicht an, aus
        // welcher Quelle sie kommt.
        console.warn('config/pages.txt nicht lesbar, nutze Vorgabeliste:', e);
        pagesSource = null;
      }
    }

    let idx = 0;
    function show(i) {
      idx = (i + PAGES.length) % PAGES.length;
      frame.src = PAGES[idx].url;
      pageEl.textContent = PAGES[idx].name
        + (pagesSource ? '' : '   ⚠ config/pages.txt fehlt – Vorgabeliste');
      dots.forEach((d, n) => d.classList.toggle('on', n === idx));
      scheduleNext();
    }
    // Erst Liste holen, dann anzeigen. Ohne await stuenden Punkte und erste
    // Seite noch fuer die Vorgabeliste.
    /* -----------------------------------------------------------------------
       ALARMUMSCHALTUNG

       Eine Wand, die stur ihre Runde dreht, zeigt den Ausfall erst in zwei
       Minuten - und dann 30 Sekunden lang. Deshalb bricht sie die Rotation ab,
       sobald etwas Kritisches anliegt, und bleibt auf der Lageseite, bis es
       vorbei ist.

       Zwei Vorkehrungen gegen Zappeln:
       - ZWEI Messungen in Folge muessen kritisch sein, bevor umgeschaltet wird.
         Ein einzelner Aussetzer (Neustart, kurzer Paketverlust) reicht nicht.
       - Nach der Entwarnung bleibt die Seite noch RUHE_MS stehen, bevor die
         Rotation weiterlaeuft. Sonst springt die Wand bei einem flatternden
         Dienst im Sekundentakt hin und her - das ist unlesbar und macht den
         Alarm unglaubwuerdig.
    ----------------------------------------------------------------------- */
    const $alarmtext = () => document.getElementById('alarmtext');
    const ALARM_POLL_MS = 15000;
    const RUHE_MS       = 60000;
    // Obergrenze: Nach dieser Zeit laeuft die Rotation weiter, auch wenn der
    // Ausfall anhaelt. Eine Wand, die stundenlang dieselbe Seite zeigt, wird
    // zur Tapete - der rote Rahmen und das Alarmband bleiben natuerlich.
    const MAX_ALARM_MS  = 15 * 60 * 1000;
    let imAlarm = false, kritFolge = 0, alarmSeit = 0, alarmBeginn = 0;
    // Nach der Obergrenze gesetzt: verhindert, dass derselbe, noch immer
    // anliegende Ausfall sofort wieder umschaltet. Faellt erst, wenn es
    // einmal entwarnt war - ein NEUER Ausfall alarmiert also wieder.
    let gedeckelt = false;

    async function pruefeLage() {
      let krit = 0, ok = 0, gesamt = 0, grund = '';
      try {
        const r = await fetch('/data/probe.json?t=' + Date.now(), { cache: 'no-store' });
        if (r.ok) {
          const d = await r.json();
          const s = d.summary || {};
          krit = s.crit || 0; ok = s.ok || 0; gesamt = s.total || 0;
          const kaputt = (d.targets || []).filter(t => t.state === 'crit');
          grund = kaputt.slice(0, 4).map(t => t.name).join(' · ');
        }
      } catch (e) { /* Messdaten unlesbar ist kein Alarm - siehe unten. */ }

      // Ist ALLES kritisch, ist fast nie alles kaputt - viel wahrscheinlicher
      // stimmt die Konfiguration nicht (Platzhalter-Adressen, DNS im Container,
      // Netz weg). Dann waere Dauer-Alarm die falsche Aussage: die Wand zeigt
      // einen Hinweis und rotiert weiter, statt sich auf einer Seite
      // festzufahren. Genau dieser Fall trat mit den Beispielzielen auf.
      const alleKaputt = gesamt > 1 && ok === 0 && krit === gesamt;
      if (alleKaputt) {
        document.body.classList.remove('alarm');
        imAlarm = false;
        $alarmtext().textContent =
          `Alle ${gesamt} Ziele nicht erreichbar – vermutlich Konfiguration ` +
          `prüfen (config/probes.txt)`;
        $alarmtext().style.display = 'block';
        return;
      }
      $alarmtext().style.display = '';

      // Bewusst KEIN Alarm, wenn die Sonde selbst nicht antwortet: Sonst
      // schaltet ein Fehler in der Ueberwachung die Wand dauerhaft auf Alarm,
      // und niemand glaubt ihr mehr.
      kritFolge = krit > 0 ? kritFolge + 1 : 0;
      // Die Ruhefrist zaehlt ab dem LETZTEN kritischen Messwert, nicht ab
      // Alarmbeginn. Ein Dienst, der alle 30 Sekunden kurz zurueckkommt,
      // beendet den Alarm sonst mitten im Flattern.
      if (krit > 0) alarmSeit = Date.now();

      if (krit === 0) gedeckelt = false;

      if (!imAlarm && !gedeckelt && kritFolge >= 2) {
        imAlarm = true; alarmBeginn = Date.now();
        document.body.classList.add('alarm');
        $alarmtext().textContent =
          `KRITISCH: ${krit} System${krit > 1 ? 'e' : ''} gestört   ${grund}`;
        clearTimeout(rotTimer);
        frame.src = ALARM_PAGE;
        pageEl.textContent = 'Alarm';
      } else if (imAlarm && Date.now() - alarmBeginn > MAX_ALARM_MS) {
        // Anhaltender Ausfall: Rotation wieder freigeben, Warnung bleibt.
        imAlarm = false; gedeckelt = true;
        show(idx + 1);
      } else if (imAlarm && krit === 0 && Date.now() - alarmSeit > RUHE_MS) {
        imAlarm = false;
        document.body.classList.remove('alarm');
        show(idx + 1);              // Rotation wieder aufnehmen
      } else if (imAlarm) {
        $alarmtext().textContent =
          krit > 0 ? `KRITISCH: ${krit} System${krit > 1 ? 'e' : ''} gestört   ${grund}`
                   : 'Entwarnung – Rotation läuft gleich weiter';
      }
    }

    // Reihenfolge zaehlt: erst Liste holen, dann anmelden, dann anzeigen.
    // Startet die Rotation vorher, zeigt die erste Runde noch den Login.
    loadPages().then(warmup).then(() => {
      buildDots(); show(0);
      pruefeLage(); setInterval(pruefeLage, ALARM_POLL_MS);
    });

    // Weiterschalten. Kein fester Takt mehr, sondern eine Kette von Timern -
    // nur so kann jede Seite ihre eigene Standzeit haben.
    function scheduleNext() {
      clearTimeout(rotTimer);
      if (imAlarm) return;          // im Alarm wird nicht weitergeschaltet
      const secs = PAGES[idx].secs;
      rotTimer = setTimeout(() => show(idx + 1),
                            secs ? secs * 1000 : ROTATE_MS);
    }
    scheduleNext();

    // Full reload keeps memory clean and recovers from any stalled state.
    setTimeout(() => location.reload(), RELOAD_MS);

    // Burn-in prevention: nudge the whole stage by up to a couple of pixels.
    let s = 0;
    setInterval(() => {
      s = (s + 1) % 4;
      const dx = [0, 1, 0, -1][s], dy = [0, 1, 0, -1][s];
      stage.style.transform = `translate(${dx}px, ${dy}px)`;
    }, SHIFT_MS);

    // Clock.
    setInterval(() => {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('en-GB');
    }, 1000);

    // Watchdog: if a frame does not signal load within 20s, reload it.
    let wd;
    function armWatchdog() {
      clearTimeout(wd);
      wd = setTimeout(() => frame.src = PAGES[idx].url, 20000);
    }
    frame.addEventListener('load', () => clearTimeout(wd));
    setInterval(armWatchdog, ROTATE_MS);
  </script>
</body>
</html>
