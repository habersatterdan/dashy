<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Störungen bei Anbietern</title>
<style>
  /* Gleiche Bildsprache wie /lage/ und /wall/: eine Wand, ein System. */
  :root{
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8a8a80;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --rule:#2e2e2c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--plane); color:var(--ink); overflow:hidden; cursor:none;
       font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
       font-variant-numeric:tabular-nums; display:flex; flex-direction:column}

  header{display:flex; align-items:baseline; gap:22px; padding:16px 30px 12px;
         border-bottom:1px solid var(--rule)}
  h1{font-size:24px; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
  #sub{color:var(--ink-3); font-size:13px; letter-spacing:.06em}
  #clock{margin-left:auto; font-size:36px; font-weight:600; line-height:1}
  #date{color:var(--ink-2); font-size:13px}

  #verdict{display:flex; align-items:center; gap:20px; margin:14px 30px 0;
    padding:16px 24px; border-radius:12px; border:1px solid var(--rule);
    background:var(--surface); border-left-width:8px}
  #verdict .glyph{font-size:44px; line-height:1}
  #verdict .txt{font-size:34px; font-weight:700}
  #verdict .note{margin-left:auto; color:var(--ink-2); font-size:15px; text-align:right}
  #verdict.ok{border-left-color:var(--good)}    #verdict.ok .txt{color:var(--good)}
  #verdict.warn{border-left-color:var(--warning)} #verdict.warn .txt{color:var(--warning)}

  /* ---------- Anbieterkarten ----------
     Eine Karte pro Anbieter, nicht eine Liste aller Meldungen durcheinander.
     Beim Vorbeilaufen zaehlt die Frage "wer hat gerade ein Problem", nicht
     die Chronologie. */
  main{flex:1; min-height:0; overflow:hidden; display:grid; gap:14px;
       grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
       align-content:start; padding:14px 30px 20px}
  .card{background:var(--surface); border:1px solid var(--rule); border-radius:12px;
        border-top-width:5px; padding:14px 18px; display:flex; flex-direction:column;
        gap:8px; min-height:0; overflow:hidden}
  .card.ok{border-top-color:var(--good)}
  .card.warn{border-top-color:var(--warning)}
  .card.err{border-top-color:var(--ink-3)}
  .card .ch{display:flex; align-items:baseline; gap:10px}
  .card .nm{font-size:20px; font-weight:700}
  .card .st{margin-left:auto; font-size:12px; letter-spacing:.1em;
            text-transform:uppercase; font-weight:700}
  .card.ok .st{color:var(--good)} .card.warn .st{color:var(--warning)}
  .card.err .st{color:var(--ink-3)}
  .item{border-top:1px solid var(--rule); padding-top:7px; display:flex;
        flex-direction:column; gap:2px}
  .item .t{font-size:15px; line-height:1.3; font-weight:600;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
           overflow:hidden}
  .item .m{font-size:12px; color:var(--ink-3); display:-webkit-box;
           -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .item .a{font-size:11px; color:var(--ink-3); letter-spacing:.06em}
  .none{color:var(--ink-3); font-size:14px; padding:6px 0}

  footer{border-top:1px solid var(--rule); padding:8px 30px; display:flex; gap:20px;
         color:var(--ink-3); font-size:12px}
  footer .r{margin-left:auto}
</style>
</head>
<body>
<header>
  <h1>Störungen bei Anbietern</h1>
  <span id="sub">Cloud- und Herstellerstatus</span>
  <div style="margin-left:auto;text-align:right">
    <div id="clock">--:--</div><div id="date">&nbsp;</div>
  </div>
</header>

<div id="verdict"><span class="glyph">⏳</span>
  <span class="txt">Lade …</span><span class="note" id="vnote"></span></div>

<main id="cards"></main>

<footer><span id="f-src">&nbsp;</span><span class="r" id="f-age">&nbsp;</span></footer>

<script>
/* ---------------------------------------------------------------------------
   Quellen kommen über den Nginx-Feed-Proxy (/feeds/<id>) - der Browser darf
   fremde Feeds nicht selbst laden (CORS).

   FRISCH-FENSTER: Statusfeeds enthalten auch alte, längst behobene Meldungen.
   Nur was jünger als FRESH_HOURS ist, gilt als laufende Störung. Ohne das
   stünde die Wand dauerhaft auf Alarm und niemand schaute mehr hin.
--------------------------------------------------------------------------- */
const REFRESH_MS  = 120000;
const FRESH_HOURS = 24;
const SOURCES = [
  { id:'m365',  name:'Microsoft 365' },
  { id:'azure', name:'Microsoft Azure' },
  { id:'cisco', name:'Cisco' },
];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tickClock(){
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  $('date').textContent  = d.toLocaleDateString('de-DE',
    {weekday:'long', day:'2-digit', month:'long'});
}

function ago(date){
  if (!date) return '';
  const min = Math.round((Date.now() - date) / 60000);
  if (min < 1)    return 'gerade eben';
  if (min < 60)   return `vor ${min} min`;
  if (min < 1440) return `vor ${Math.round(min/60)} h`;
  return `vor ${Math.round(min/1440)} Tagen`;
}

/* Text aus dem Feed säubern: HTML raus, Whitespace zusammenziehen. Sonst
   steht auf der Wand eine Textwüste mit <p>-Resten. */
function clean(html){
  const el = document.createElement('div');
  el.innerHTML = html || '';
  return (el.textContent || '').replace(/\s+/g, ' ').trim();
}

async function loadSource(src){
  const r = await fetch('/feeds/' + src.id + '?t=' + Date.now(), {cache:'no-store'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('Feed nicht lesbar');
  return [...doc.querySelectorAll('item, entry')].map(n => {
    const q = sel => n.querySelector(sel)?.textContent?.trim() || '';
    const when = q('pubDate') || q('published') || q('updated');
    const d = when ? new Date(when) : null;
    return { title: clean(q('title')),
             text: clean(q('description') || q('summary') || q('content')),
             date: (d && !isNaN(d)) ? d : null };
  }).filter(i => i.title);
}

function renderCard(src, items, err){
  if (err){
    return `<div class="card err"><div class="ch"><span class="nm">${esc(src.name)}</span>
      <span class="st">Quelle nicht erreichbar</span></div>
      <div class="none">${esc(err)}</div></div>`;
  }
  const cutoff = Date.now() - FRESH_HOURS * 3600 * 1000;
  const fresh = items.filter(i => i.date && i.date.getTime() > cutoff);
  const show  = (fresh.length ? fresh : items).slice(0, 3);
  const ok    = fresh.length === 0;
  return `<div class="card ${ok ? 'ok' : 'warn'}">
      <div class="ch"><span class="nm">${esc(src.name)}</span>
        <span class="st">${ok ? '✓ keine aktuelle Störung'
                              : '! ' + fresh.length + ' aktuelle Meldung'
                                + (fresh.length > 1 ? 'en' : '')}</span></div>
      ${ok ? `<div class="none">Letzte Meldung ${
                show[0] ? esc(ago(show[0].date)) : 'unbekannt'}</div>` : ''}
      ${show.map(i => `<div class="item">
          <div class="t">${esc(i.title)}</div>
          <div class="m">${esc(i.text)}</div>
          <div class="a">${esc(ago(i.date))}</div></div>`).join('')
        || '<div class="none">Keine Einträge im Feed.</div>'}
    </div>`;
}

async function refresh(){
  const results = await Promise.all(SOURCES.map(async src => {
    try { return { src, items: await loadSource(src) }; }
    catch(e){ return { src, items: [], err: String(e.message || e) }; }
  }));

  $('cards').innerHTML = results.map(r => renderCard(r.src, r.items, r.err)).join('');

  const cutoff = Date.now() - FRESH_HOURS * 3600 * 1000;
  const hit = results.filter(r => !r.err &&
    r.items.some(i => i.date && i.date.getTime() > cutoff));
  const dead = results.filter(r => r.err);

  const v = $('verdict');
  if (hit.length){
    v.className = 'warn';
    v.querySelector('.glyph').textContent = '!';
    v.querySelector('.txt').textContent =
      `Störung bei ${hit.map(r => r.src.name).join(', ')}`;
    $('vnote').textContent = `Meldungen der letzten ${FRESH_HOURS} Stunden`;
  } else {
    v.className = 'ok';
    v.querySelector('.glyph').textContent = '✓';
    v.querySelector('.txt').textContent = 'Keine Anbieterstörung gemeldet';
    $('vnote').textContent = `Stand der letzten ${FRESH_HOURS} Stunden`;
  }

  $('f-src').textContent = dead.length
    ? '⚠ Quelle nicht erreichbar: ' + dead.map(r => r.src.name).join(', ')
    : `${results.length} Quellen abgefragt`;
  $('f-age').textContent = 'Aktualisiert ' +
    new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}

tickClock(); setInterval(tickClock, 1000);
refresh(); setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
