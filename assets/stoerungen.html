<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anbieterstatus</title>
<style>
  /* Gleiche Bildsprache wie /lage/ und /wall/: eine Wand, ein System.
     Statusfarbe traegt nie allein Bedeutung - jeder Zustand hat Farbe,
     Symbol UND ausgeschriebenes Label. */
  :root{
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7;
    --ink-3:#8a8a80; --good:#0ca30c; --warning:#fab219; --serious:#ec835a;
    --critical:#d03b3b; --rule:#2e2e2c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--plane); color:var(--ink); overflow:hidden; cursor:none;
       font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
       font-variant-numeric:tabular-nums; display:flex; flex-direction:column;
       transition:transform .6s ease}

  header{display:flex; align-items:baseline; gap:22px; padding:16px 30px 12px;
         border-bottom:1px solid var(--rule)}
  h1{font-size:24px; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
  #sub{color:var(--ink-3); font-size:13px}
  #clock{margin-left:auto; font-size:36px; font-weight:600; line-height:1}
  #date{color:var(--ink-2); font-size:13px}

  /* Globale Statuszeile: die eine Aussage, die im Vorbeigehen zaehlt. */
  #verdict{display:flex; align-items:center; gap:20px; margin:14px 30px 0;
    padding:16px 24px; border-radius:12px; border:1px solid var(--rule);
    background:var(--surface); border-left-width:8px}
  #verdict .glyph{font-size:44px; line-height:1; width:48px; text-align:center}
  #verdict .txt{font-size:34px; font-weight:700; letter-spacing:.02em}
  #verdict .note{margin-left:auto; color:var(--ink-2); font-size:15px; text-align:right}
  #verdict.crit{border-left-color:var(--critical)} #verdict.crit .txt{color:var(--critical)}
  #verdict.warn{border-left-color:var(--warning)}  #verdict.warn .txt{color:var(--warning)}
  #verdict.ok{border-left-color:var(--good)}       #verdict.ok .txt{color:var(--good)}
  #verdict.unk{border-left-color:var(--ink-3)}     #verdict.unk .txt{color:var(--ink-2)}

  main{flex:1; min-height:0; display:grid; gap:16px; padding:14px 30px 18px;
       grid-template-columns:repeat(3,1fr); align-items:stretch}
  .card{background:var(--surface); border:1px solid var(--rule); border-radius:12px;
        border-top-width:6px; padding:16px 18px; display:flex; flex-direction:column;
        gap:10px; min-height:0; overflow:hidden}
  .card.crit{border-top-color:var(--critical)} .card.warn{border-top-color:var(--warning)}
  .card.plan{border-top-color:var(--serious)}  .card.ok{border-top-color:var(--good)}
  .card.unk {border-top-color:var(--ink-3)}
  .card .nm{font-size:22px; font-weight:700}
  .card .st{font-size:15px; font-weight:700; letter-spacing:.04em; display:flex;
            align-items:center; gap:8px}
  .card.crit .st{color:var(--critical)} .card.warn .st{color:var(--warning)}
  .card.plan .st{color:var(--serious)}  .card.ok  .st{color:var(--good)}
  .card.unk  .st{color:var(--ink-2)}
  .card .stale{font-size:12px; color:var(--warning); letter-spacing:.04em}

  .item{border-top:1px solid var(--rule); padding-top:9px; display:flex;
        flex-direction:column; gap:3px}
  /* Zwei Zeilen hart begrenzt: 34 px waeren aus 5 m ideal, passen aber nur
     ~20 Zeilen auf den Schirm. 20 px Titel plus harte Klammer auf zwei Zeilen
     haelt drei Meldungen je Anbieter lesbar. */
  .item .t{font-size:20px; line-height:1.25; font-weight:600;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
           overflow:hidden}
  .item .meta{font-size:13px; color:var(--ink-3); display:flex; gap:10px}
  .item .badge{font-weight:700; letter-spacing:.06em}
  .item.outage   .badge{color:var(--critical)}
  .item.degraded .badge{color:var(--warning)}
  .item.planned  .badge{color:var(--serious)}
  .item.resolved .badge,.item.cancelled .badge{color:var(--good)}
  .item.nodate   .badge{color:var(--ink-2)}
  .none{color:var(--ink-3); font-size:15px; line-height:1.5}

  footer{border-top:1px solid var(--rule); padding:8px 30px; display:flex; gap:22px;
         color:var(--ink-3); font-size:12px}
  footer .r{margin-left:auto}
</style>
</head>
<body>
<header>
  <h1>Anbieterstatus</h1>
  <span id="sub">Öffentliche Statusmeldungen</span>
  <div style="margin-left:auto;text-align:right">
    <div id="clock">--:--</div><div id="date">&nbsp;</div>
  </div>
</header>

<div id="verdict" class="unk"><span class="glyph">?</span>
  <span class="txt">Lade …</span><span class="note" id="vnote"></span></div>

<main id="cards"></main>

<footer>
  <span>● Ausfall &nbsp; ▲ Beeinträchtigung &nbsp; ◆ Wartung &nbsp; ✓ behoben &nbsp; ? Datenproblem</span>
  <span class="r" id="f-age">&nbsp;</span>
</footer>

<script>
/* ---------------------------------------------------------------------------
   Quellen ueber den Nginx-Feed-Proxy (/feeds/<id>) - der Browser darf fremde
   Feeds nicht selbst laden (CORS).

   Wortwahl mit Absicht: "Keine frische aktive Meldung" statt "alles laeuft".
   Die oeffentlichen Feeds decken nur breit wirksame Stoerungen ab; was nur
   euren Tenant oder eine Region trifft, steht in Service Health, nicht hier.
   Die Wand darf keine Sicherheit behaupten, die die Quelle nicht hergibt.
--------------------------------------------------------------------------- */
const REFRESH_MS = 300000;      // 5 Minuten
const TIMEOUT_MS = 15000;
const MAX_ITEMS  = 3;           // je Anbieter
const SHIFT_MS   = 600000;      // Burn-in: alle 10 min ein paar Pixel

// Rueckfallebene. Die tatsaechliche Liste kommt aus config/sources.txt -
// so laesst sich eine Quelle ergaenzen, ohne diese Datei anzufassen (sie ist
// versioniert, eine Aenderung waere beim naechsten Update weg).
let SOURCES = [
  { id:'m365',  name:'Microsoft 365' },
  { id:'azure', name:'Microsoft Azure' },
  { id:'cisco', name:'Cisco' },
];

async function loadSources(){
  try{
    const r = await fetch('/config/sources.txt?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const list = [];
    for (const line of (await r.text()).split('\n')){
      const l = line.trim();
      if (!l || l.startsWith('#')) continue;
      const [name, id] = l.split('|').map(x => x.trim());
      if (id) list.push({ id, name: name || id });
    }
    if (list.length) SOURCES = list;
  } catch(e){
    console.warn('config/sources.txt nicht lesbar, nutze Vorgabeliste:', e);
  }
}

/* ---8<--- LOGIC START (wird von scripts/test-stoerungen.mjs extrahiert) ---- */

/* Frisch-Fenster je Zustand, nicht pauschal.
   Begruendung: Ein nachts begonnener Ausfall waere mit 24 h schon wieder
   unsichtbar; eine geplante Wartung darf umgekehrt keine wochenlange
   Dauerwarnung erzeugen; eine behobene Meldung ist nur so lange interessant,
   bis der Vorbeigehende weiss, warum es vorhin rot war. */
const FRESH_HOURS = { outage: 36, degraded: 36, planned: 12, resolved: 4, info: 12 };

/* Rangfolge der Zustaende. Die Reihenfolge ist der eigentliche Trick:
   "Resolved: major outage" enthaelt beide Begriffe. Wird zuerst auf
   "behoben" geprueft, gewinnt der Endzustand - sonst stuende ein laengst
   erledigter Ausfall dauerhaft rot an der Wand.
   Ebenso "Maintenance cancelled due to ongoing incident": abgesagt zuerst. */
const RULES = [
  { state:'cancelled', words:['cancelled','canceled','abgesagt','entfaellt'] },
  { state:'resolved',  words:['resolved','restored','mitigated','recovered',
                              'completed','behoben','wiederhergestellt','gelöst',
                              'abgeschlossen'] },
  { state:'planned',   words:['planned maintenance','scheduled maintenance',
                              'maintenance window','scheduled event','wartungsfenster',
                              'geplante wartung','wartungsarbeiten'] },
  { state:'outage',    words:['outage','unavailable','major incident','critical',
                              'service down','total loss','ausfall','nicht verfügbar'] },
  { state:'degraded',  words:['degraded','degradation','intermittent','investigating',
                              'identified','latency','packet loss','beeinträchtigt',
                              'eingeschränkt','störung'] },
];

const RANK = { outage:0, degraded:1, nodate:2, planned:3, cancelled:4, resolved:4, info:5 };

/* Klassifikation ausschliesslich ueber den TITEL.
   Der Beschreibungstext enthaelt bei Wartungsmeldungen fast immer Woerter wie
   "impact" oder "degraded" - er wuerde jede geplante Wartung zum Ausfall
   machen. Der Titel traegt bei allen drei Anbietern den Endzustand. */
function classify(item){
  if (!item.date) return 'nodate';
  const t = (item.title || '').toLowerCase();
  for (const r of RULES) if (r.words.some(w => t.includes(w))) return r.state;
  return 'info';
}

/* Ist die Meldung im Frisch-Fenster ihres Zustands? */
function isFresh(item, now){
  if (item.state === 'nodate') return true;   // Datenproblem bleibt sichtbar
  const h = FRESH_HOURS[item.state] ?? 12;
  return (now - item.date.getTime()) < h * 3600 * 1000;
}

/* Etwas, das gerade stoert - nur das faerbt die Wand. */
function isActive(item){
  return item.state === 'outage' || item.state === 'degraded';
}

/* Deterministische Reihenfolge: erst nach Rang, bei Gleichstand das Neuere. */
function sortItems(items){
  return items.slice().sort((a, b) =>
    (RANK[a.state] - RANK[b.state]) ||
    ((b.date ? b.date.getTime() : 0) - (a.date ? a.date.getTime() : 0)));
}

/* Wandtaugliche Kurzform: Anbieter-Praefix weg, Abschnittsmarken abschneiden,
   harte Laengengrenze. Das CSS begrenzt zusaetzlich auf zwei Zeilen. */
const CUTMARKS = ['impact statement','current status','next update','maintenance details',
                  'data centers','components','scope of impact','preliminary root cause',
                  'date and time'];
function shorten(title){
  let t = String(title || '').replace(/\s+/g, ' ').trim();
  t = t.replace(/^\s*(resolved|investigating|identified|monitoring|update|scheduled|completed|in progress)\s*[:\-–]\s*/i, '');
  const low = t.toLowerCase();
  for (const m of CUTMARKS){
    const i = low.indexOf(m);
    if (i > 20){ t = t.slice(0, i).trim().replace(/[-–—:,;]$/, ''); break; }
  }
  return t.length > 118 ? t.slice(0, 117).trimEnd() + '…' : t;
}

/* ---8<--- LOGIC END -------------------------------------------------------- */

/* --- Anzeige-Texte je Zustand ------------------------------------------- */
const BADGE = {
  outage:   { g:'●', t:'AUSFALL' },
  degraded: { g:'▲', t:'BEEINTRÄCHTIGUNG' },
  planned:  { g:'◆', t:'WARTUNG' },
  resolved: { g:'✓', t:'BEHOBEN' },
  cancelled:{ g:'✓', t:'ABGESAGT' },
  nodate:   { g:'?', t:'DATUM FEHLT' },
  info:     { g:'·', t:'INFO' },
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tickClock(){
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  $('date').textContent  = d.toLocaleDateString('de-DE',
    {weekday:'long', day:'2-digit', month:'long'});
}

function ago(date){
  if (!date) return 'ohne Datum';
  const min = Math.round((Date.now() - date.getTime()) / 60000);
  if (min < 1)    return 'gerade eben';
  if (min < 60)   return `vor ${min} min`;
  if (min < 1440) return `vor ${Math.round(min/60)} h`;
  return `vor ${Math.round(min/1440)} Tagen`;
}

function textOf(html){
  const el = document.createElement('div');
  el.innerHTML = html || '';
  return (el.textContent || '').replace(/\s+/g, ' ').trim();
}

/* --- Feed holen und lesen ------------------------------------------------ */
function parseFeed(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('kein gültiges XML');
  const nodes = [...doc.querySelectorAll('item, entry')];
  if (!nodes.length) throw new Error('keine Einträge im Feed');
  return nodes.map(n => {
    const pick = (...names) => {
      for (const nm of names){
        const el = [...n.children].find(c => c.tagName.replace(/^.*:/, '') === nm);
        if (el && el.textContent.trim()) return el.textContent.trim();
      }
      return '';
    };
    const when = pick('updated','published','pubDate','date');
    const d = when ? new Date(when) : null;
    return { title: textOf(pick('title')),
             date: (d && !isNaN(d.getTime())) ? d : null };
  }).filter(i => i.title);
}

async function fetchFeed(src){
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try{
    const r = await fetch('/feeds/' + src.id + '?t=' + Date.now(),
                          { cache:'no-store', signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return parseFeed(await r.text());
  } catch(e){
    throw new Error(e.name === 'AbortError' ? 'Zeitüberschreitung'
                                            : (e.message || String(e)));
  } finally { clearTimeout(to); }
}

/* Letzten erfolgreichen Stand behalten. Wichtig: der Ausfall der Quelle bleibt
   sichtbar - eine leere Karte darf nie wie "alles in Ordnung" aussehen. */
function cacheKey(id){ return 'noc.feed.' + id; }
function saveCache(id, items){
  try{ localStorage.setItem(cacheKey(id), JSON.stringify(
    { at: Date.now(), items: items.map(i => ({ title:i.title,
        date: i.date ? i.date.toISOString() : null })) })); }catch(e){}
}
function loadCache(id){
  try{
    const raw = localStorage.getItem(cacheKey(id));
    if (!raw) return null;
    const o = JSON.parse(raw);
    return { at: o.at, items: o.items.map(i => ({ title:i.title,
             date: i.date ? new Date(i.date) : null })) };
  }catch(e){ return null; }
}

/* --- Karten -------------------------------------------------------------- */
function prepare(items, now){
  return sortItems(items.map(i => ({ ...i, state: classify(i) }))
                        .filter(i => isFresh(i, now)));
}

function cardClass(shown, err){
  if (err && !shown.length) return 'unk';
  if (shown.some(i => i.state === 'outage'))   return 'crit';
  if (shown.some(i => i.state === 'degraded')) return 'warn';
  if (shown.some(i => i.state === 'planned'))  return 'plan';
  if (shown.some(i => i.state === 'nodate'))   return 'unk';
  return 'ok';
}

function cardStatus(shown, err){
  if (err && !shown.length) return { g:'?', t:'QUELLE NICHT ERREICHBAR' };
  const first = ['outage','degraded','planned','nodate'].find(s =>
    shown.some(i => i.state === s));
  if (first) return { g: BADGE[first].g, t: BADGE[first].t };
  return { g:'✓', t:'KEINE FRISCHE AKTIVE MELDUNG' };
}

function renderCard(src, shown, err, fromCache, cacheAge){
  const cls = cardClass(shown, err);
  const st  = cardStatus(shown, err);
  const body = shown.length
    ? shown.slice(0, MAX_ITEMS).map(i => `
        <div class="item ${i.state}">
          <div class="t">${esc(shorten(i.title))}</div>
          <div class="meta"><span class="badge">${BADGE[i.state].g} ${BADGE[i.state].t}</span>
            <span>${esc(ago(i.date))}</span></div>
        </div>`).join('')
    : `<div class="none">${err
        ? esc(err)
        : 'Im öffentlichen Feed steht nichts Aktuelles. Was nur euren Tenant '
          + 'oder eine Region betrifft, erscheint hier nicht.'}</div>`;
  return `<div class="card ${cls}">
      <div class="nm">${esc(src.name)}</div>
      <div class="st"><span>${st.g}</span><span>${st.t}</span></div>
      ${err && shown.length ? `<div class="stale">⚠ Quelle nicht erreichbar (${esc(err)})</div>` : ''}
      ${fromCache ? `<div class="stale">⚠ Zwischenspeicher von ${esc(ago(new Date(cacheAge)))}</div>` : ''}
      ${body}
    </div>`;
}

async function refresh(){
  const now = Date.now();
  const results = await Promise.all(SOURCES.map(async src => {
    try{
      const items = await fetchFeed(src);
      saveCache(src.id, items);
      return { src, shown: prepare(items, now) };
    } catch(e){
      const c = loadCache(src.id);
      return { src, err: String(e.message || e), fromCache: !!c,
               cacheAge: c ? c.at : 0,
               shown: c ? prepare(c.items, now) : [] };
    }
  }));

  $('cards').innerHTML = results.map(r =>
    renderCard(r.src, r.shown, r.err, r.fromCache, r.cacheAge)).join('');

  /* Globaler Zustand. Rangfolge: laufender Ausfall schlaegt alles, dann
     Beeintraechtigung, dann unvollstaendige Datenlage (eine ausgefallene
     Quelle DARF nicht als "stabil" durchgehen), dann Wartung. */
  const active  = results.filter(r => r.shown.some(isActive));
  const outage  = results.filter(r => r.shown.some(i => i.state === 'outage'));
  const dead    = results.filter(r => r.err);
  const planned = results.filter(r => r.shown.some(i => i.state === 'planned'));
  const v = $('verdict');
  const set = (cls, g, t, note) => {
    v.className = cls;
    v.querySelector('.glyph').textContent = g;
    v.querySelector('.txt').textContent = t;
    $('vnote').textContent = note;
  };

  if (outage.length){
    set('crit', '●', 'Aktiver Ausfall: ' + outage.map(r => r.src.name).join(', '),
        'Meldung der letzten 36 Stunden');
  } else if (active.length){
    set('warn', '▲', 'Beeinträchtigung: ' + active.map(r => r.src.name).join(', '),
        'Meldung der letzten 36 Stunden');
  } else if (dead.length){
    set('unk', '?', 'Datenlage unvollständig',
        'Quelle nicht erreichbar: ' + dead.map(r => r.src.name).join(', '));
  } else if (planned.length){
    set('warn', '◆', 'Geplante Wartung: ' + planned.map(r => r.src.name).join(', '),
        'in den nächsten Stunden');
  } else {
    set('ok', '✓', 'Keine frische aktive Meldung',
        'Öffentliche Feeds — tenant-spezifisches steht in Service Health');
  }

  $('f-age').textContent = 'Aktualisiert ' +
    new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}

/* Burn-in: das ganze Bild alle 10 Minuten um wenige Pixel versetzen.
   Ersetzt bei OLED keinen Hardwareschutz, hilft aber gegen eingebrannte
   Kanten an immer gleicher Stelle. */
let shift = 0;
setInterval(() => {
  shift = (shift + 1) % 4;
  const dx = [0,2,0,-2][shift], dy = [0,2,0,-2][shift];
  document.body.style.transform = `translate(${dx}px,${dy}px)`;
}, SHIFT_MS);

tickClock(); setInterval(tickClock, 1000);
loadSources().then(refresh);
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
