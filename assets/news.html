<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sicherheitsnachrichten</title>
<style>
  /* Gleiche Bildsprache wie /lage/, /stoerungen/ und /wall/. */
  :root{
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8a8a80;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --rule:#2e2e2c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--plane); color:var(--ink); overflow:hidden; cursor:none;
       font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
       font-variant-numeric:tabular-nums; display:flex; flex-direction:column;
       transition:transform .6s ease}

  header{display:flex; align-items:baseline; gap:20px; padding:14px 26px 10px;
         border-bottom:1px solid var(--rule)}
  h1{font-size:22px; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
  #sub{color:var(--ink-3); font-size:13px}
  #kev{margin-left:auto; font-size:13px; color:var(--ink-2)}
  #kev b{color:var(--critical)}
  #clock{font-size:30px; font-weight:600; line-height:1; margin-left:18px}

  /* Spalten: eine Quelle je Spalte. Nebeneinander statt untereinander - so
     sieht man auf einen Blick, ob EINE Quelle etwas meldet oder ALLE. Ein
     Thema, das überall gleichzeitig auftaucht, ist die große Sache. */
  main{flex:1; min-height:0; display:grid; gap:12px; padding:12px 26px 14px;
       grid-auto-flow:column; grid-auto-columns:1fr}
  .col{background:var(--surface); border:1px solid var(--rule); border-radius:10px;
       display:flex; flex-direction:column; min-height:0; overflow:hidden}
  .colh{display:flex; align-items:center; gap:8px; padding:9px 13px;
        border-bottom:1px solid var(--rule); background:var(--surface-2)}
  .colh .nm{font-size:14px; font-weight:700; letter-spacing:.06em;
            text-transform:uppercase; white-space:nowrap; overflow:hidden;
            text-overflow:ellipsis}
  .colh .n{margin-left:auto; font-size:12px; color:var(--ink-3)}
  .items{flex:1; min-height:0; overflow:hidden; padding:4px 0}
  .it{padding:8px 13px; border-bottom:1px solid var(--rule);
      border-left:4px solid transparent}
  .it:last-child{border-bottom:0}
  .it.critical{border-left-color:var(--critical); background:#1f1414}
  .it.serious {border-left-color:var(--serious)}
  .it.warning {border-left-color:var(--warning)}
  .it .t{font-size:14px; line-height:1.32; font-weight:600;
         display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
         overflow:hidden}
  .it .m{margin-top:3px; font-size:11px; color:var(--ink-3); display:flex;
         gap:8px; align-items:center}
  .it .cve{font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--ink-2)}
  .it .kevmark{color:var(--critical); font-weight:700}
  .err{padding:12px 13px; font-size:13px; color:var(--warning); line-height:1.5}
  .leer{padding:12px 13px; font-size:13px; color:var(--ink-3)}

  footer{border-top:1px solid var(--rule); padding:7px 26px; display:flex;
         gap:18px; color:var(--ink-3); font-size:12px}
  footer .r{margin-left:auto}
</style>
</head>
<body>
<header>
  <h1>Sicherheitsnachrichten</h1>
  <span id="sub">Lade …</span>
  <span id="kev"></span>
  <span id="clock">--:--</span>
</header>
<main id="cols"></main>
<footer><span id="f-src"></span><span class="r" id="f-age"></span></footer>

<script>
/* ---------------------------------------------------------------------------
   Mehrere Quellen NEBENEINANDER statt hintereinander.

   Der Unterschied ist inhaltlich, nicht kosmetisch: In einer gemischten Liste
   sieht man nicht, ob eine Quelle viel meldet oder alle gleichzeitig. Taucht
   dasselbe Thema in drei Spalten auf, ist es die grosse Sache des Tages -
   genau das erkennt man hier in einer Sekunde.

   Quellen kommen aus config/news.txt, die Feeds ueber den Nginx-Proxy
   (/feeds/<id>) - der Browser darf fremde Feeds nicht selbst laden (CORS).
--------------------------------------------------------------------------- */
const REFRESH_MS = 300000;   // 5 min
const TIMEOUT_MS = 15000;
const MAX_PRO_SPALTE = 7;
const SHIFT_MS = 600000;

let QUELLEN = [
  { name: 'BSI CERT-Bund',   id: 'bsi' },
  { name: 'CISA Advisories', id: 'cisa' },
  { name: 'Cisco PSIRT',     id: 'cisco' },
];
let kevSet = new Set();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tickClock(){
  $('clock').textContent = new Date()
    .toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}

function alter(d){
  if (!d) return '';
  const min = Math.round((Date.now() - d.getTime())/60000);
  if (min < 60)   return `vor ${Math.max(min,1)} min`;
  if (min < 1440) return `vor ${Math.round(min/60)} h`;
  return `vor ${Math.round(min/1440)} T`;
}

function klartext(html){
  const el = document.createElement('div');
  el.innerHTML = html || '';
  return (el.textContent || '').replace(/\s+/g,' ').trim();
}

/* Einstufung: KEV schlaegt alles. Das ist eine autoritative Liste der
   nachweislich ausgenutzten Luecken - keine Textanalyse. Erst ohne
   KEV-Treffer greift die Stichwortsuche, und die bleibt bewusst grob. */
const SCHWER = [
  { s:'critical', w:['aktiv ausgenutzt','exploited','zero-day','0-day','wurm','wormable','rce ohne','kritisch','critical'] },
  { s:'serious',  w:['remote code execution','rce','privilege escalation','authentication bypass','hoch','high'] },
  { s:'warning',  w:['denial of service','dos','information disclosure','mittel','medium'] },
];
function einstufen(titel, text){
  const gross = (titel + ' ' + text).toUpperCase();
  const cves = gross.match(/CVE-\d{4}-\d{4,7}/g) || [];
  const kev = cves.find(c => kevSet.has(c));
  if (kev) return { sev:'critical', cve:kev, kev:true };
  const klein = (titel + ' ' + text).toLowerCase();
  for (const r of SCHWER)
    if (r.w.some(w => klein.includes(w))) return { sev:r.s, cve:cves[0]||null, kev:false };
  return { sev:'', cve:cves[0]||null, kev:false };
}

async function ladeKev(){
  try{
    const r = await fetch('/feeds/kev?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const d = await r.json();
    kevSet = new Set((d.vulnerabilities||[]).map(v => (v.cveID||'').toUpperCase()));
  }catch(e){ /* ohne KEV bleibt die Stichwortsuche - kein Grund zu scheitern */ }
}

async function ladeQuellen(){
  try{
    const r = await fetch('/config/news.txt?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const liste = [];
    for (const z of (await r.text()).split('\n')){
      const l = z.trim();
      if (!l || l.startsWith('#')) continue;
      const [name, id] = l.split('|').map(x => x.trim());
      if (id) liste.push({ name: name || id, id });
    }
    if (liste.length) QUELLEN = liste.slice(0, 6);
  }catch(e){ console.warn('config/news.txt nicht lesbar:', e); }
}

async function ladeFeed(q){
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try{
    const r = await fetch('/feeds/' + q.id + '?t=' + Date.now(),
                          {cache:'no-store', signal: ctl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const doc = new DOMParser().parseFromString(await r.text(), 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('kein gültiges XML');
    return [...doc.querySelectorAll('item, entry')].map(n => {
      const q1 = sel => n.querySelector(sel)?.textContent?.trim() || '';
      const w = q1('pubDate') || q1('published') || q1('updated');
      const d = w ? new Date(w) : null;
      const titel = klartext(q1('title'));
      const text  = klartext(q1('description') || q1('summary') || q1('content'));
      return { titel, text, datum: (d && !isNaN(d)) ? d : null,
               ...einstufen(titel, text) };
    }).filter(i => i.titel)
      .sort((a,b) => (b.datum?.getTime()||0) - (a.datum?.getTime()||0));
  } catch(e){
    throw new Error(e.name === 'AbortError' ? 'Zeitüberschreitung'
                                            : (e.message || String(e)));
  } finally { clearTimeout(to); }
}

function spalte(q, eintraege, fehler){
  const kopf = `<div class="colh"><span class="nm">${esc(q.name)}</span>
      <span class="n">${fehler ? '—' : eintraege.length}</span></div>`;
  if (fehler)
    return `<div class="col">${kopf}<div class="err">⚠ Quelle nicht erreichbar<br>
        ${esc(fehler)}</div></div>`;
  if (!eintraege.length)
    return `<div class="col">${kopf}<div class="leer">Keine Einträge.</div></div>`;
  const items = eintraege.slice(0, MAX_PRO_SPALTE).map(i => `
      <div class="it ${i.sev}">
        <div class="t">${esc(i.titel)}</div>
        <div class="m">
          ${i.kev ? '<span class="kevmark">⚠ AKTIV AUSGENUTZT</span>' : ''}
          ${i.cve ? `<span class="cve">${esc(i.cve)}</span>` : ''}
          <span>${esc(alter(i.datum))}</span>
        </div>
      </div>`).join('');
  return `<div class="col">${kopf}<div class="items">${items}</div></div>`;
}

async function refresh(){
  await ladeKev();
  const erg = await Promise.all(QUELLEN.map(async q => {
    try { return { q, items: await ladeFeed(q) }; }
    catch(e){ return { q, items: [], fehler: String(e.message || e) }; }
  }));

  $('cols').innerHTML = erg.map(r => spalte(r.q, r.items, r.fehler)).join('');

  const kevTreffer = erg.flatMap(r => r.items).filter(i => i.kev).length;
  $('kev').innerHTML = kevSet.size
    ? (kevTreffer ? `<b>${kevTreffer} aktiv ausgenutzt</b> in den Meldungen`
                  : `${kevSet.size} bekannte ausgenutzte CVEs abgeglichen`)
    : 'KEV-Liste nicht verfügbar';
  const tot = erg.filter(r => r.fehler);
  $('sub').textContent = `${erg.length - tot.length} von ${erg.length} Quellen`;
  $('f-src').textContent = tot.length
    ? '⚠ nicht erreichbar: ' + tot.map(r => r.q.name).join(', ')
    : 'Alle Quellen erreichbar';
  $('f-age').textContent = 'Aktualisiert ' +
    new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}

/* Burn-in: das Bild alle 10 Minuten um wenige Pixel versetzen. */
let shift = 0;
setInterval(() => {
  shift = (shift + 1) % 4;
  const d = [0,2,0,-2][shift];
  document.body.style.transform = `translate(${d}px,${d}px)`;
}, SHIFT_MS);

tickClock(); setInterval(tickClock, 1000);
ladeQuellen().then(refresh);
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
