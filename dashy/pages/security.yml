# =============================================================================
# SECURITY / COMPLIANCE - Advisories & Warnungen (RSS)
# Behörden-Feeds (BSI, CISA) sind für ISO 27001 / NIS2 besonders relevant.
# =============================================================================
pageInfo:
  title: Security

sections:
  - name: Behörden (ISO 27001 / NIS2)
    icon: fas fa-landmark
    displayData:
      cols: 2
    widgets:
      - type: rss-feed
        updateInterval: 900
        options:
          # BSI CERT-Bund Sicherheitswarnungen (WID)
          rssUrl: https://wid.cert-bund.de/content/public/securityAdvisory/rss
          limit: 4
      - type: rss-feed
        updateInterval: 900
        options:
          # CISA (US) Advisories
          rssUrl: https://www.cisa.gov/cybersecurity-advisories/all.xml
          limit: 4

  - name: Hersteller-Advisories
    icon: fas fa-shield-halved
    displayData:
      cols: 3
    widgets:
      - type: rss-feed
        updateInterval: 900
        options:
          # Cisco PSIRT
          rssUrl: https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml
          limit: 4
      - type: rss-feed
        updateInterval: 900
        options:
          # Fortinet (Firewall) PSIRT
          rssUrl: https://filestore.fortinet.com/fortiguard/rss/ir.xml
          limit: 4
      - type: rss-feed
        updateInterval: 900
        options:
          # VMware Security
          rssUrl: https://blogs.vmware.com/security/feed
          limit: 4
