# =============================================================================
# PAGE 2 - NETWORK
# =============================================================================
pageInfo:
  title: Network

sections:
  - name: Cisco Platform
    icon: si-cisco
    displayData:
      cols: 2
    items:
      - title: Catalyst Center
        description: Cisco DNA / Catalyst Center assurance
        icon: si-cisco
        url: https://dnac.example.local
        statusCheck: true
      - title: Cisco ISE
        description: Identity Services Engine
        icon: si-cisco
        url: https://ise.example.local/admin
        statusCheck: true
      - title: Cisco Secure Access
        description: SSE / Secure Access dashboard
        icon: si-cisco
        url: https://dashboard.sse.cisco.com
        statusCheck: true

  - name: Perimeter & WAN
    icon: fas fa-network-wired
    displayData:
      cols: 2
    items:
      - title: Firewall
        description: Next-gen firewall console
        icon: fas fa-shield-alt
        url: https://firewall.example.local
        statusCheck: true
      - title: WAN Monitoring
        description: Circuit / SD-WAN health
        icon: fas fa-globe
        url: https://wan-monitor.example.local
        statusCheck: true

  - name: Catalyst Center & SD-WAN (API)
    icon: si-cisco
    widgets:
      # --- Cisco Catalyst Center (DNA Center) network health via REST API ----
      # Auth: POST /dna/system/api/v1/auth/token with Basic (user:pass) returns
      # an X-Auth-Token. Dashy's api-response widget sends a static header, so
      # supply a currently-valid token (rotate via a small cron/sidecar) OR read
      # the value through your own proxy. See docs/MONITORING.md for the flow.
      - type: api-response
        updateInterval: 120
        options:
          url: https://dnac.example.local/dna/intent/api/v1/network-health
          method: GET
          headers:
            X-Auth-Token: REPLACE_WITH_CATALYST_XAUTH_TOKEN
      # --- Cisco SD-WAN (Catalyst SD-WAN / vManage) device status ------------
      # Auth: session cookie (JSESSIONID) + XSRF token from /j_security_check.
      # Easiest robust path is to surface vManage data via Grafana (below) and
      # iframe that; the direct call here needs a valid session cookie header.
      - type: api-response
        updateInterval: 120
        options:
          url: https://vmanage.example.local/dataservice/device
          method: GET
          headers:
            Cookie: JSESSIONID=REPLACE_WITH_VMANAGE_SESSION
            X-XSRF-TOKEN: REPLACE_WITH_VMANAGE_XSRF

  - name: Live Network Health (Grafana)
    icon: si-grafana
    widgets:
      # Embed a Grafana dashboard panel. Use a kiosk/anonymous view URL and
      # append ?kiosk&theme=dark. Example uses a shared/public snapshot panel.
      - type: iframe
        options:
          url: https://grafana.example.local/d/network-overview?orgId=1&kiosk&theme=dark
          frameHeight: 460

  - name: Interface Reachability
    icon: fas fa-heartbeat
    widgets:
      - type: health-check
        updateInterval: 60
        options:
          urls:
            - label: Core Switch 1
              url: https://core-sw-01.example.local
            - label: Core Switch 2
              url: https://core-sw-02.example.local
            - label: Edge Router
              url: https://edge-rtr-01.example.local
            - label: WAN Gateway
              url: https://wan-gw.example.local
