# =============================================================================
# PAGE 4 - EXECUTIVE BOARD (high level, KPI oriented)
# =============================================================================
pageInfo:
  title: Executive

sections:
  - name: System Availability
    icon: fas fa-chart-line
    widgets:
      # Grafana single-stat / gauge panel embedded as an availability KPI.
      - type: iframe
        options:
          url: https://grafana.example.local/d-solo/exec-availability?orgId=1&panelId=2&kiosk&theme=dark
          frameHeight: 300

  - name: Active Alerts
    icon: fas fa-bell
    widgets:
      - type: zabbix-problems
        updateInterval: 60
        options:
          hostname: https://zabbix.example.local
          apiToken: REPLACE_WITH_ZABBIX_API_TOKEN
          count: 8

  - name: Service Health
    icon: fas fa-heartbeat
    widgets:
      - type: health-check
        updateInterval: 120
        options:
          urls:
            - label: ERP
              url: https://erp.example.local
            - label: Email (M365)
              url: https://status.office365.com
            - label: Intranet
              url: https://intranet.example.local
            - label: Datacenter Core
              url: https://core-sw-01.example.local

  - name: Company KPIs
    icon: fas fa-briefcase
    displayData:
      cols: 3
    widgets:
      # Placeholder KPI tiles. Point these iframes at your BI/Grafana panels.
      - type: iframe
        options:
          url: /tiles/kpi-placeholder.html
