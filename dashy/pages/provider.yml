# =============================================================================
# PROVIDER / ISP STÖRUNGEN - Screenshot einer nicht-einbettbaren Seite
# Das Bild wird vom "shotter"-Container erzeugt (alle 5 Min) und von Nginx
# unter /shots/<name>.png ausgeliefert. Kein iframe-Verbot, weil es ein Bild ist.
# =============================================================================
pageInfo:
  title: Provider

sections:
  - name: Allestörungen (Live-Screenshot)
    icon: fas fa-tower-broadcast
    displayData:
      cols: 1
    widgets:
      - type: iframe
        options:
          # Cache-Buster über den Titel ist nicht nötig - Nginx sendet no-store.
          url: /shots/allestoerungen.png
          frameHeight: 900
