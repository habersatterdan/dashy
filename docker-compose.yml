services:
  # ---------------------------------------------------------------------------
  # Dashy - the dashboard engine that renders all NOC signage pages/widgets.
  # ---------------------------------------------------------------------------
  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./profiles/${DASHY_PROFILE:-enterprise}/conf.yml:/app/user-data/conf.yml:ro
      - ./profiles/${DASHY_PROFILE:-enterprise}/pages:/app/user-data/pages:ro
      - ./assets:/app/user-data/item-icons/assets:ro
      - ./nginx/certs:/certs:ro
      # CA-Buendel des Hosts: enthaelt die CA des SSL-Inspection-Proxys, ohne
      # die Dashys RSS-Widgets "Unable to fetch data" melden.
      - ${HOST_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/host-ca-bundle.crt:ro
    environment:
      - NODE_ENV=production
      - UID=1000
      - GID=1000
      # Node liest zusaetzliche CAs aus dieser Datei (ergaenzt den eingebauten
      # Store). Das Host-Buendel enthaelt die Proxy-CA -> behebt
      # "Unable to fetch data" bei den RSS-Widgets.
      - NODE_EXTRA_CA_CERTS=/etc/ssl/host-ca-bundle.crt
    healthcheck:
      # Dashy ships a small health script; fall back to a plain HTTP probe.
      test: ["CMD", "node", "/app/services/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # --- Haertung -------------------------------------------------------
    # no-new-privileges: ein Prozess im Container kann seine Rechte nicht mehr
    # ueber setuid erhoehen - schliesst den haeufigsten Ausbruchspfad.
    # cap_drop ALL: keine Linux-Capabilities. Was gebraucht wird, steht
    # darunter ausdruecklich in cap_add - alles andere hat hier nichts zu tun.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - signage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Nginx - TLS termination (HTTPS only), reverse proxy, /health endpoint and
  # the kiosk rotation wrapper that cycles through the four Dashy pages.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      dashy:
        condition: service_healthy
    # Standardmaessig lauscht Nginx auf allen Adressen des Pi. Hat der Pi mehr
    # als eine (WLAN + LAN, oder mehrere VLANs), kann man ihn hier an genau
    # eine binden: BIND_ADDR=10.30.50.12 in .env. Dann ist die Wand aus den
    # anderen Netzen gar nicht erst erreichbar - wirksamer als jede Regel im
    # Webserver.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:80:80"
      - "${BIND_ADDR:-0.0.0.0}:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./profiles/${DASHY_PROFILE:-enterprise}/pages:/usr/share/nginx/html/pages:ro
      # Screenshots produced by the "shotter" service, served at /shots/*.png
      - ./shots:/usr/share/nginx/html/shots:ro
      # Messdaten der Sonde; Nginx liefert nur probe.json aus.
      - ./state:/usr/share/nginx/html/data:ro
      # Seitenliste der Wand; Nginx liefert daraus nur pages.txt aus.
      - ./config:/usr/share/nginx/html/wandconfig:ro
    # Notausgang, wenn der Container einen internen Namen nicht aufloest:
    # Dockers DNS kennt die Suchdomaene des Firmennetzes nicht. Statt YAML zu
    # bearbeiten in .env setzen, z. B.
    #     EXTRA_HOST_1=zabbix.firma.local:10.0.0.42
    # Der Vorgabewert ist ein Blindeintrag: Docker verlangt hier eine gueltige
    # Zeile, und "leer" ist keine.
    extra_hosts:
      - "${EXTRA_HOST_1:-nicht-gesetzt.invalid:0.0.0.0}"
      - "${EXTRA_HOST_2:-nicht-gesetzt2.invalid:0.0.0.0}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # --- Haertung -------------------------------------------------------
    # no-new-privileges: ein Prozess im Container kann seine Rechte nicht mehr
    # ueber setuid erhoehen - schliesst den haeufigsten Ausbruchspfad.
    # cap_drop ALL: keine Linux-Capabilities. Was gebraucht wird, steht
    # darunter ausdruecklich in cap_add - alles andere hat hier nichts zu tun.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    networks:
      - signage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Grafana - die Messwerte gross und schoen.
  #
  # WARUM ZUSAETZLICH ZU ZABBIX: Zabbix ist ein hervorragender Sammler, seine
  # Oberflaeche ist aber fuer den Schreibtisch gebaut. Grafana liest dieselben
  # Daten ueber das Zabbix-Plugin und stellt sie wandtauglich dar - grosse
  # Zahlen, Verlaeufe, Trends. Kein zweiter Agent, keine zweite Datenhaltung.
  #
  # Die Dashboards liegen als JSON im Repo (grafana/dashboards) und werden beim
  # Start eingelesen: versioniert und nach einem Neuaufbau sofort wieder da -
  # anders als etwas im Browser Zusammengeklicktes.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
      - ${HOST_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/host-ca-bundle.crt:ro
    environment:
      # Laeuft hinter unserem Nginx unter /grafana/ - ohne diese beiden Zeilen
      # zeigen alle internen Links ins Leere.
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Die Wand bedient niemand: Anzeige ohne Anmeldung, aber nur lesend.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_BASIC_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=${GRAFANA_HIDE_LOGIN:-false}
      # Einbetten in die Kiosk-Seite erlauben (X-Frame-Options aus).
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Zabbix-Plugin + Infinity (liest unser eigenes probe.json/cve.json).
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app,yesoreyeram-infinity-datasource
      - GF_PLUGINS_PREINSTALL_DISABLED=false
      # Kein Telemetrie-Rauschen, keine Werbung auf der Wand.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_USERS_DEFAULT_THEME=dark
      # Firmen-CA, sonst scheitert der Abruf hinter dem SSL-Inspection-Proxy.
      - SSL_CERT_FILE=/etc/ssl/host-ca-bundle.crt
      # Beim ERSTEN Start laedt Grafana die Plugins von grafana.com. Verlangt
      # euer Netz dafuer einen Proxy, hier eintragen (in .env setzen):
      #   HTTP_PROXY=http://proxy.firma.local:8080
      # Leer lassen ist harmlos - dann geht Grafana direkt ins Netz.
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,nginx,dashy,probe}
      - TZ=${TZ:-Europe/Berlin}
    extra_hosts:
      - "${EXTRA_HOST_1:-nicht-gesetzt.invalid:0.0.0.0}"
      - "${EXTRA_HOST_2:-nicht-gesetzt2.invalid:0.0.0.0}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # --- Haertung -------------------------------------------------------
    # no-new-privileges: ein Prozess im Container kann seine Rechte nicht mehr
    # ueber setuid erhoehen - schliesst den haeufigsten Ausbruchspfad.
    # cap_drop ALL: keine Linux-Capabilities. Was gebraucht wird, steht
    # darunter ausdruecklich in cap_add - alles andere hat hier nichts zu tun.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - signage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Watchtower - automatic container image updates on a nightly schedule.
  # ---------------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    # ABGESCHALTET, ausser man will es ausdruecklich:
    #     docker compose --profile auto-update up -d
    #
    # WARUM: Watchtower braucht den Docker-Socket, und wer den Socket hat, ist
    # faktisch root auf dem Pi - auf demselben Geraet, das den Zabbix-Token
    # haelt. Dafuer bekommt man automatische Image-Updates, die auch mal eine
    # laufende Wand kaputtmachen. Fuer Updates gibt es ./scripts/update.sh:
    # kontrolliert, nachvollziehbar, ohne Socket.
    profiles: ["auto-update"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Run every night at 04:00 (cron: sec min hour dom mon dow).
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      # Watchtower handelt sonst eine API-Version aus, die neuere
      # Docker-Versionen ablehnen: "client version 1.25 is too old".
      # Folge war eine Neustartschleife. Feste Version behebt das.
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.44}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=false
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_ROLLING_RESTART=true
      - TZ=${TZ:-Europe/Berlin}
    # --- Haertung -------------------------------------------------------
    # no-new-privileges: ein Prozess im Container kann seine Rechte nicht mehr
    # ueber setuid erhoehen - schliesst den haeufigsten Ausbruchspfad.
    # cap_drop ALL: keine Linux-Capabilities. Was gebraucht wird, steht
    # darunter ausdruecklich in cap_add - alles andere hat hier nichts zu tun.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - signage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Shotter - periodic headless-Chromium screenshots of sites that refuse
  # iframe embedding (Downdetector/Allestörungen etc.). Images land in ./shots
  # and are served by Nginx at /shots/<name>.png for display on a Dashy page.
  # Configure targets as "name=url" entries in SHOT_TARGETS (space-separated).
  # ---------------------------------------------------------------------------
  shotter:
    image: zenika/alpine-chrome:124
    container_name: shotter
    restart: unless-stopped
    # ABGESCHALTET, ausser man braucht ihn:
    #     docker compose --profile screenshots up -d
    #
    # WARUM: Hier rendert Chromium FREMDE Webseiten - genau die Angriffsflaeche,
    # gegen die Browser-Sandboxes gebaut sind. Ohne Ziele (Standard) laeuft der
    # Dienst ohnehin leer; ihn trotzdem mitlaufen zu lassen waere ein
    # unnoetiges Risiko auf dem Geraet, das eure Token haelt.
    profiles: ["screenshots"]
    # Nicht mehr als root: ein Ausbruch aus dem Renderer landet dann bei einem
    # Benutzer ohne Rechte.
    user: "${SHOTTER_UID:-1000}:${SHOTTER_GID:-1000}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /shots
        while true; do
          for t in $${SHOT_TARGETS}; do
            name="$${t%%=*}"; url="$${t#*=}"
            echo "shooting $$name -> $$url"
            chromium-browser --headless=new --no-sandbox --disable-gpu \
              --hide-scrollbars --ignore-certificate-errors \
              --window-size=1920,1080 --screenshot=/shots/$$name.png "$$url" \
              || echo "failed: $$name"
          done
          sleep $${SHOT_INTERVAL:-300}
        done
    environment:
      - SHOT_INTERVAL=300
      # name=url  (umlaut domains as punycode). Add more, space-separated.
      # Beispiel: intern=https://intranet.example.local  (Allestörungen entfernt: Bot-Schutz)
      - SHOT_TARGETS=
      # If the container must reach the internet through a corporate proxy,
      # uncomment and set these (and add --proxy-server in command if needed):
      # - HTTPS_PROXY=http://proxy.example.local:8080
      # - HTTP_PROXY=http://proxy.example.local:8080
    volumes:
      - ./shots:/shots
    # --- Haertung -------------------------------------------------------
    # no-new-privileges: ein Prozess im Container kann seine Rechte nicht mehr
    # ueber setuid erhoehen - schliesst den haeufigsten Ausbruchspfad.
    # cap_drop ALL: keine Linux-Capabilities. Was gebraucht wird, steht
    # darunter ausdruecklich in cap_add - alles andere hat hier nichts zu tun.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - signage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Probe - misst selbst, statt Nachrichten zu lesen.
  # Prueft jede Zeile aus config/probes.txt (HTTP-Status, Antwortzeit,
  # Zertifikatsrestlaufzeit, offene Ports, DNS) und schreibt das Ergebnis nach
  # ./state/probe.json. Nginx liefert es unter /data/probe.json aus, die
  # Betriebslage-Wand (/lage/) rendert es. Braucht keinerlei Zugangsdaten.
  # ---------------------------------------------------------------------------
  probe:
    image: python:3.12-alpine
    container_name: probe
    restart: unless-stopped
    # Nicht als root. Die Sonde braucht nur Netz und Schreibrecht auf /state.
    # Muss zum Eigentuemer von ./state passen - ./scripts/update.sh richtet das
    # ein. Abweichende UID: RUN_UID/RUN_GID in .env.
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    # Dateisystem schreibgeschuetzt: geschrieben wird ausschliesslich in
    # /state (eingehaengt) und /tmp (fluechtig). Ein manipuliertes Skript
    # koennte sich damit nicht einmal selbst veraendern.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    command: ["python", "/app/probe.py"]
    volumes:
      # Verzeichnisse mounten, nicht Einzeldateien - siehe cve-watcher.
      - ./services/probe:/app:ro
      - ./config:/config:ro
      - ./state:/state
      - ./nginx/certs:/certs:ro
      - ${HOST_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/host-ca-bundle.crt:ro
    environment:
      - PROBE_INTERVAL=${PROBE_INTERVAL:-60}
      - PROBE_TIMEOUT=${PROBE_TIMEOUT:-8}
      # Ab dieser Antwortzeit gilt ein Dienst als langsam (gelb).
      - PROBE_SLOW_MS=${PROBE_SLOW_MS:-2000}
      - PROBE_CERT_WARN_DAYS=${PROBE_CERT_WARN_DAYS:-30}
      - PROBE_CERT_CRIT_DAYS=${PROBE_CERT_CRIT_DAYS:-7}
      # Interne Zertifikate sind der Normalfall: die Erreichbarkeit soll nicht
      # an einer fehlenden CA scheitern. Die Restlaufzeit wird trotzdem gelesen.
      - PROBE_VERIFY_TLS=${PROBE_VERIFY_TLS:-false}
      # Suchdomaene fuer punktlose Kurznamen (z. B. 'srv001' ->
      # 'srv001.firma.local'). Der Container kennt die Suchdomaene des
      # Firmennetzes nicht - ohne das scheitert jeder Kurzname.
      - PROBE_DNS_SUFFIX=${PROBE_DNS_SUFFIX:-}
      - CORP_CA_FILE=/etc/ssl/host-ca-bundle.crt:/certs/chain.crt
      - TZ=${TZ:-Europe/Berlin}
    # Gleiche Kruecke wie bei nginx: interne Namen, die Dockers DNS nicht kennt.
    extra_hosts:
      - "${EXTRA_HOST_1:-nicht-gesetzt.invalid:0.0.0.0}"
      - "${EXTRA_HOST_2:-nicht-gesetzt2.invalid:0.0.0.0}"
    healthcheck:
      # Gesund = die Messdatei ist juenger als drei Intervalle. Ein Prozess,
      # der noch laeuft, aber nichts mehr schreibt, faellt sonst nicht auf -
      # und die Wand zeigt stundenalte Werte, ohne es zu sagen.
      test: ["CMD-SHELL", "python -c \"import os,time,sys; f='/state/probe.json'; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f) < 3*int(os.getenv('PROBE_INTERVAL','60')) else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    # --- Haertung -------------------------------------------------------
    # no-new-privileges: ein Prozess im Container kann seine Rechte nicht mehr
    # ueber setuid erhoehen - schliesst den haeufigsten Ausbruchspfad.
    # cap_drop ALL: keine Linux-Capabilities. Was gebraucht wird, steht
    # darunter ausdruecklich in cap_add - alles andere hat hier nichts zu tun.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - signage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # M365 Service Health - die ECHTE Lage eures Tenants.
  #
  # Einen oeffentlichen Service-Health-Feed gibt es nicht mehr; was oeffentlich
  # bleibt, meldet Aenderungen, keine Stoerungen. Tenant-Stoerungen stehen nur
  # im Service Health Dashboard - erreichbar ueber die Graph-API.
  #
  # Genau EINE Berechtigung: ServiceHealth.Read.All (Anwendung). Damit kann
  # dieser Dienst Dienstzustaende lesen und sonst nichts - keine Postfaecher,
  # keine Benutzer, keine Dateien. Einrichtung: docs/M365.md
  #
  # Ohne Zugangsdaten bleibt der Dienst still, statt in einer Neustartschleife
  # zu landen.
  # ---------------------------------------------------------------------------
  m365:
    image: python:3.12-alpine
    container_name: m365
    restart: unless-stopped
    command: ["python", "/app/health.py"]
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    env_file:
      - config/secrets.env
    volumes:
      - ./services/m365:/app:ro
      - ./state:/state
      - ./nginx/certs:/certs:ro
      - ${HOST_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/host-ca-bundle.crt:ro
    environment:
      - M365_POLL_SECONDS=${M365_POLL_SECONDS:-300}
      # Leer = alle Dienste. Sonst kommagetrennt, z. B.
      # "Exchange Online,Microsoft Teams,SharePoint Online"
      - M365_SERVICES=${M365_SERVICES:-}
      - CORP_CA_FILE=/etc/ssl/host-ca-bundle.crt:/certs/chain.crt
      - TZ=${TZ:-Europe/Berlin}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time,sys; f='/state/m365.json'; sys.exit(0 if not os.getenv('M365_TENANT_ID') or (os.path.exists(f) and time.time()-os.path.getmtime(f) < 3*int(os.getenv('M365_POLL_SECONDS','300'))) else 1)\""]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 180s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - signage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # CVE-Watcher - meldet externe Schwachstellen, die EURE Produkte betreffen.
  # Zieht Advisory-Feeds, holt echtes CVSS von der NVD, prueft CISAs KEV-Liste,
  # filtert gegen config/watchlist.txt und sendet JSON-Webhooks (P1/P2).
  # Startet bewusst mit DRY_RUN=true: schreibt nur ins Log, sendet nichts.
  # ---------------------------------------------------------------------------
  cve-watcher:
    image: python:3.12-alpine
    container_name: cve-watcher
    restart: unless-stopped
    # Nicht als root. Der Watcher braucht nur Netz und Schreibrecht auf /state.
    # Muss zum Eigentuemer von ./state passen - ./scripts/update.sh richtet das
    # ein. Abweichende UID: RUN_UID/RUN_GID in .env.
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    # Dateisystem schreibgeschuetzt: geschrieben wird ausschliesslich in
    # /state (eingehaengt) und /tmp (fluechtig). Ein manipuliertes Skript
    # koennte sich damit nicht einmal selbst veraendern.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    command: ["python", "/app/watch.py"]
    # Geheimnisse kommen direkt aus der zentralen Datei in den Container.
    # docker compose selbst liest nur ./.env - ohne env_file kaeme die
    # Webhook-URL aus config/secrets.env nie beim Watcher an.
    env_file:
      - config/secrets.env
    volumes:
      # Verzeichnis mounten, NICHT die einzelne Datei: ein Bind-Mount auf
      # eine Datei haengt an deren Inode. 'git pull' schreibt die Datei neu
      # (neue Inode) - der Container saehe weiter den alten Stand.
      - ./services/cve-watcher:/app:ro
      - ./config:/config:ro
      - ./state:/state
      - ./nginx/certs:/certs:ro
      # Fertiges CA-Buendel des Hosts (oeffentliche Root-CAs + alle per
      # update-ca-certificates installierten Firmen-CAs, inkl. der CA des
      # SSL-Inspection-Proxys). Ohne das scheitert jede aufgebrochene
      # Verbindung - auch zu oeffentlichen Zielen wie Azure.
      - ${HOST_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/host-ca-bundle.crt:ro
    environment:
      # Erst beobachten, dann scharf schalten: DRY_RUN=false sendet wirklich.
      - DRY_RUN=${CVE_DRY_RUN:-true}
      # WEBHOOK_URL / WEBHOOK_AUTH_HEADER / NVD_API_KEY kommen aus env_file
      # (config/secrets.env). Sie duerfen hier NICHT stehen: environment
      # ueberschreibt env_file, ein leerer Wert wuerde den echten loeschen.
      - MIN_CVSS=${CVE_MIN_CVSS:-7.0}
      - POLL_SECONDS=${CVE_POLL_SECONDS:-1800}
      - MAX_WEBHOOKS_PER_RUN=${CVE_MAX_PER_RUN:-10}
      # true = ein gebuendelter Aufruf je Durchlauf statt einer je CVE.
      - CVE_BATCH=${CVE_BATCH:-true}
      # Fertige Adaptive Card fuer Teams im Payload mitschicken.
      - CVE_ADAPTIVE_CARD=${CVE_ADAPTIVE_CARD:-true}
      # Mehrere CA-Dateien, durch ":" getrennt, ZUSAETZLICH zum System-Store.
      # Nicht SSL_CERT_FILE verwenden - das ersetzt den Store, statt ihn zu
      # ergaenzen. Das Host-Buendel steht zuerst: es enthaelt die Proxy-CA.
      - CORP_CA_FILE=/etc/ssl/host-ca-bundle.crt:/certs/chain.crt
      - TZ=${TZ:-Europe/Berlin}
    # --- Haertung -------------------------------------------------------
    # no-new-privileges: ein Prozess im Container kann seine Rechte nicht mehr
    # ueber setuid erhoehen - schliesst den haeufigsten Ausbruchspfad.
    # cap_drop ALL: keine Linux-Capabilities. Was gebraucht wird, steht
    # darunter ausdruecklich in cap_add - alles andere hat hier nichts zu tun.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - signage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Grafanas eigene Datenbank (Benutzer, Plugin-Zustand). Die Dashboards
  # kommen aus dem Repo, hier liegt nur, was Grafana selbst braucht.
  grafana-data:

networks:
  signage:
    driver: bridge
